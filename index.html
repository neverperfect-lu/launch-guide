<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAUNCH</title>
<style>
/* ==========================================================================
   LAUNCH — Gründer-Betriebssystem
   Palette   Marken-Anthrazit #111622 · Karten #181D29 · Hairline #252934
             Licht #F5F5F7 / #FFFFFF · Chip-Grau #E0E0E2
             Akzent: System-Blau, sehr sparsam. Sonst monochrom.
   Type      Systemschrift (SF Pro auf Apple-Geräten) in abgestuften Gewichten,
             Systemmono nur für kleine Labels. Keine Webfonts.
   Layout    App-Shell. Sidebar ab 940px, sonst Bottom-Tabs. Lesespalte 68ch.
   Idee      Die Rakete montiert sich über den Fortschritt: nicht gebaute
             Teile sind feine Umrisse, gebaute sind massiv.
   ========================================================================== */

:root {
  /* dark = Marken-Default */
  --bg:        #111622;
  --bg-2:      #141A28;
  --surf:      #181D29;
  --surf-2:    #1D2331;
  --surf-3:    #232A3A;
  --hair:      #252934;
  --hair-2:    #1C212D;
  --text:      #FFFFFF;
  --text-2:    #C3C2C6;
  --text-3:    #8A8B94;
  --sig:       #0A84FF;
  --sig-2:     #6FB6FF;
  --sig-dim:   #16233A;
  --sig-ink:   #FFFFFF;
  --steel:     #5B6272;
  --ok:        #30D158;
  --ok-dim:    #16281C;
  --alert:     #FF453A;
  --alert-dim: #2A1618;
  --blur:      rgba(17,22,34,.78);
  --lift:      0 1px 2px rgba(0,0,0,.28), 0 12px 32px -14px rgba(0,0,0,.55);
  --ring:      #0A84FF;
  --rk-fill:   #2C3444;
  --rk-line:   #7E8698;

  --f-disp: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-ui:   -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;

  --nav: 274px;
  --r:   16px;
  --r-s: 12px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #F5F5F7;
    --bg-2:      #FFFFFF;
    --surf:      #FFFFFF;
    --surf-2:    #F0F0F2;
    --surf-3:    #E7E7E9;
    --hair:      #E0E0E2;
    --hair-2:    #EBEBED;
    --text:      #111622;
    --text-2:    #57596B;
    --text-3:    #86868B;
    --sig:       #0066CC;
    --sig-2:     #004C99;
    --sig-dim:   #EAF2FC;
    --sig-ink:   #FFFFFF;
    --steel:     #A9ABB4;
    --ok:        #1D8A3E;
    --ok-dim:    #E9F6EC;
    --alert:     #C9271C;
    --alert-dim: #FDECEA;
    --blur:      rgba(245,245,247,.8);
    --lift:      0 1px 2px rgba(17,22,34,.05), 0 10px 30px -12px rgba(17,22,34,.14);
    --ring:      #0066CC;
    --rk-fill:   #DCDDE2;
    --rk-line:   #8A8C95;
  }
}
:root[data-theme="light"] {
  --bg:        #F5F5F7;
  --bg-2:      #FFFFFF;
  --surf:      #FFFFFF;
  --surf-2:    #F0F0F2;
  --surf-3:    #E7E7E9;
  --hair:      #E0E0E2;
  --hair-2:    #EBEBED;
  --text:      #111622;
  --text-2:    #57596B;
  --text-3:    #86868B;
  --sig:       #0066CC;
  --sig-2:     #004C99;
  --sig-dim:   #EAF2FC;
  --sig-ink:   #FFFFFF;
  --steel:     #A9ABB4;
  --ok:        #1D8A3E;
  --ok-dim:    #E9F6EC;
  --alert:     #C9271C;
  --alert-dim: #FDECEA;
  --blur:      rgba(245,245,247,.8);
  --lift:      0 1px 2px rgba(17,22,34,.05), 0 10px 30px -12px rgba(17,22,34,.14);
  --ring:      #0066CC;
  --rk-fill:   #DCDDE2;
  --rk-line:   #8A8C95;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--f-ui); font-size: 16.5px; line-height: 1.53;
  letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
a { color: var(--sig); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }

/* ---------- typography ---------- */
.tele {
  font-size: 11.5px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase; color: var(--text-3);
  margin: 0 0 12px;
}
h1 {
  font-family: var(--f-disp); font-weight: 700;
  font-size: clamp(30px, 6.6vw, 44px); line-height: 1.06;
  letter-spacing: -.028em; margin: 0 0 14px; text-wrap: balance;
}
h2 {
  font-family: var(--f-disp); font-weight: 600; font-size: 23px;
  line-height: 1.2; letter-spacing: -.021em; margin: 44px 0 14px;
  text-wrap: balance;
}
h3 {
  font-family: var(--f-disp); font-weight: 600; font-size: 17.5px;
  letter-spacing: -.014em; margin: 28px 0 8px;
}
p { margin: 0 0 14px; }
.lead { font-size: 18px; color: var(--text-2); line-height: 1.48; letter-spacing: -.014em; margin-bottom: 26px; }

/* ---------- shell ---------- */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--nav); z-index: 40;
  display: none; flex-direction: column;
  background: linear-gradient(180deg, var(--bg-2), var(--bg) 55%);
  border-right: 1px solid var(--hair);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 22px 20px 8px; }
.brand img { width: 36px; height: 36px; border-radius: 50%; display: block; flex: 0 0 auto; }
.brand b {
  font-family: var(--f-disp); font-weight: 600; font-size: 21px;
  letter-spacing: .2em; line-height: 1;
}
.brand .wordmark { display: block; min-width: 0; }
.brand #brandSub {
  display: block; font-size: 11.5px; letter-spacing: -.005em;
  color: var(--text-3); margin-top: 3px;
}

.langrow { padding: 0 20px 12px; }
.lang {
  display: inline-flex; gap: 2px; padding: 2px;
  background: var(--surf-2); border: 1px solid var(--hair); border-radius: 999px;
}
.lang button {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; border: 0; border-radius: 999px; background: none;
  color: var(--text-3); font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.lang button i { font-style: normal; font-size: 13px; line-height: 1; }
.lang button[aria-pressed="true"] { background: var(--surf); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.16); }
.lang--mini { flex: 0 0 auto; }
.lang--mini button { padding: 3px 8px; font-size: 11.5px; }

.gauge { padding: 12px 20px 14px; border-bottom: 1px solid var(--hair-2); }
.gauge__row { display: flex; align-items: center; gap: 11px; }
.gauge svg { width: 26px; height: 46px; flex: 0 0 auto; }
.gauge__t { min-width: 0; flex: 1 1 auto; }
.gauge__t b { display: block; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.gauge__t span { display: block; font-size: 12.5px; color: var(--text-3); letter-spacing: -.006em; }

.nav { padding: 10px; display: flex; flex-direction: column; gap: 1px; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 7px 10px; border: 0; border-radius: var(--r-s); background: none;
  color: var(--text-2); font-size: 15.5px; letter-spacing: -.012em;
  text-align: left; cursor: pointer;
}
.nav button:hover { background: var(--surf-2); color: var(--text); }
.nav button[aria-current="true"] { background: var(--surf-2); color: var(--text); font-weight: 600; }
.nav i {
  font-style: normal; flex: 0 0 auto;
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; font-size: 13px;
  background: var(--surf-3); color: var(--text-2);
}
.nav button[aria-current="true"] i { background: var(--text); color: var(--bg); }

.find {
  margin: 6px 10px; width: calc(100% - 20px);
  display: flex; align-items: center; gap: 9px; padding: 9px 12px;
  background: var(--surf-2); border: 1px solid var(--hair); border-radius: var(--r-s);
  color: var(--text-3); font-size: 14.5px; cursor: pointer;
}
.find:hover { border-color: var(--sig); color: var(--text-2); }
.find kbd {
  margin-left: auto; font-family: var(--f-mono); font-size: 11px;
  border: 1px solid var(--hair); border-radius: 5px; padding: 1px 6px; color: var(--text-3);
}
.side__end {
  margin-top: auto; padding: 14px 20px 18px; border-top: 1px solid var(--hair-2);
  font-size: 11.5px; color: var(--text-3); display: flex; flex-direction: column; gap: 6px;
}

.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px; padding: 9px 14px;
  background: var(--blur); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hair);
}
.top img { width: 28px; height: 28px; border-radius: 50%; display: block; }
.top b { font-family: var(--f-disp); font-weight: 600; font-size: 17px; letter-spacing: .2em; }
.top .gauge__mini { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.top .gauge__mini svg { width: 16px; height: 28px; }
.top .gauge__mini span { font-size: 12.5px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
.iconb {
  width: 34px; height: 34px; border-radius: var(--r-s); flex: 0 0 auto;
  display: grid; place-items: center; padding: 0;
  background: var(--surf-2); border: 1px solid var(--hair); color: var(--text-2); cursor: pointer;
}
.iconb:hover { color: var(--text); border-color: var(--sig); }
.iconb svg { width: 16px; height: 16px; }

.main { padding: 0 0 102px; }
.wrap { max-width: 800px; margin: 0 auto; padding: 24px 17px 0; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--blur); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--hair); padding-bottom: env(safe-area-inset-bottom, 0);
}
.tabs button {
  background: none; border: 0; cursor: pointer; padding: 7px 2px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-3);
}
.tabs button i { font-style: normal; font-size: 17px; line-height: 1; }
.tabs button span { font-size: 10.5px; letter-spacing: -.004em; }
.tabs button[aria-current="true"] { color: var(--text); font-weight: 600; }

.ask {
  position: fixed; right: 15px; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 46; height: 46px; padding: 0 18px; border-radius: 999px;
  background: var(--text); color: var(--bg); border: 0; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  font-family: var(--f-disp); font-weight: 600; font-size: 14px; letter-spacing: .02em;
  box-shadow: 0 12px 28px -10px rgba(0,0,0,.65);
}
.ask:hover { opacity: .88; }
.ask svg { width: 15px; height: 15px; }
.ask span { font-family: var(--f-disp); }

/* ---------- rocket ---------- */
.bay {
  position: relative; border: 1px solid var(--hair); border-radius: 20px;
  background: var(--surf); box-shadow: var(--lift);
  padding: 22px 20px 24px; margin-bottom: 22px; overflow: hidden;
}
.bay__grid { display: none; }
.bay__in { position: relative; display: grid; grid-template-columns: 116px 1fr; gap: 16px; align-items: center; }
.rocket { width: 100%; max-width: 116px; margin: 0; display: block; height: auto; }
.bay__chips { position: relative; margin-top: 14px; }

.rocket .part { transition: opacity .55s ease, fill .55s ease, stroke .55s ease; }
.rocket .part--todo { fill: none; stroke: var(--steel); stroke-width: 1.1; stroke-dasharray: 3 4; opacity: .5; }
.rocket .part--done { stroke-width: 1; opacity: 1; }
.rocket .skin  { fill: var(--rk-fill); stroke: var(--rk-line); }
.rocket .accent{ fill: var(--sig); stroke: none; }
.rocket .glass { fill: var(--bg); stroke: var(--rk-line); }
.rocket .rig   { fill: none; stroke: var(--steel); stroke-width: 1; opacity: .8; }
.rocket .flame { opacity: 0; transition: opacity .6s ease; }
.rocket.lit .flame { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .rocket.lit .flame { animation: burn 1.1s ease-in-out infinite alternate; }
}
@keyframes burn { from { transform: scaleY(.92); } to { transform: scaleY(1.07); } }

.readout { display: flex; flex-direction: column; gap: 10px; }
.readout__hd { display: flex; align-items: baseline; gap: 10px; }
.readout__hd b { font-family: var(--f-disp); font-weight: 600; font-size: 18px; letter-spacing: -.02em; }
.readout__hd span {
  margin-left: auto; font-size: 14px; font-weight: 500;
  color: var(--text-2); font-variant-numeric: tabular-nums;
}
.bar { height: 5px; border-radius: 999px; background: var(--surf-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sig); border-radius: 999px; transition: width .45s cubic-bezier(.4,0,.2,1); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { cursor: default; }
.chip {
  font-size: 11.5px; font-weight: 500; letter-spacing: -.005em;
  padding: 5px 11px; border-radius: 999px; border: 1px solid var(--hair);
  background: var(--surf-2); color: var(--text-2); cursor: pointer;
}
.chip--on { border-color: var(--text); background: var(--text); color: var(--bg); font-weight: 600; }
.chip--part { border-color: var(--text-3); color: var(--text); font-weight: 600; }
.chip--go { border-color: var(--hair-2); background: transparent; color: var(--text-3); }
.chip--go i { font-style: normal; color: var(--ok); font-weight: 700; margin-right: 4px; }
.readout p { margin: 0; font-size: 14.5px; color: var(--text-2); line-height: 1.45; letter-spacing: -.008em; }

/* ---------- generic blocks ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 16px; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600;
  border: 1px solid var(--hair); background: var(--surf-3); color: var(--text);
}
.btn:hover { text-decoration: none; border-color: var(--sig); }
.btn--p { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn--p:hover { opacity: .88; }
.row { display: flex; flex-wrap: wrap; gap: 9px; }

.cards { display: grid; gap: 11px; grid-template-columns: 1fr; }
.card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--surf); border: 1px solid var(--hair); border-radius: var(--r);
  padding: 17px 18px; color: var(--text); box-shadow: var(--lift);
  transition: transform .18s ease, border-color .18s ease;
}
.card:hover { border-color: var(--text-3); text-decoration: none; transform: translateY(-1px); }
.card em {
  font-style: normal; display: block; margin-bottom: 7px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3);
}
.card b { display: block; font-family: var(--f-disp); font-weight: 600; font-size: 17px; letter-spacing: -.017em; margin-bottom: 4px; }
.card p { margin: 0; font-size: 14.5px; color: var(--text-2); line-height: 1.45; letter-spacing: -.01em; }

.list { display: flex; flex-direction: column; gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: var(--r); overflow: hidden; }
.item {
  background: var(--surf); border: 0; width: 100%; text-align: left; cursor: pointer;
  padding: 15px 18px; display: flex; align-items: center; gap: 13px;
}
.item:hover { background: var(--surf-2); }
.item div { min-width: 0; flex: 1 1 auto; }
.item b { display: block; font-family: var(--f-disp); font-weight: 600; font-size: 16px; letter-spacing: -.016em; }
.item span { display: block; font-size: 14px; color: var(--text-2); line-height: 1.42; margin-top: 2px; letter-spacing: -.008em; }
.item > svg { flex: 0 0 auto; width: 15px; height: 15px; color: var(--text-3); }

.stat3 {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--hair); border: 1px solid var(--hair); border-radius: var(--r);
  overflow: hidden; margin-bottom: 22px;
}
.stat3 > div { background: var(--surf); padding: 15px 15px; }
.stat3 b {
  display: block; font-family: var(--f-disp); font-weight: 600; font-size: 26px;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-bottom: 1px;
}
.stat3 span { font-size: 12px; color: var(--text-3); letter-spacing: -.005em; }

/* ---------- stages ---------- */
.stage { border: 1px solid var(--hair); border-radius: var(--r); background: var(--surf); overflow: hidden; margin-bottom: 11px; }
.stage__hd {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 14px 16px; background: none; border: 0; cursor: pointer; text-align: left;
}
.stage__hd:hover { background: var(--surf-2); }
.stage__ix {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; background: var(--surf-3); border: 0;
  font-size: 12px; font-weight: 600; color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.stage--full .stage__ix { background: var(--ok-dim); border-color: var(--ok); color: var(--ok); }
.stage__t { flex: 1 1 auto; min-width: 0; }
.stage__t b { display: block; font-family: var(--f-disp); font-weight: 600; font-size: 16px; }
.stage__t span { display: block; font-size: 12.5px; color: var(--text-3); }
.stage__n {
  flex: 0 0 auto; font-size: 12px; color: var(--text-2);
  background: var(--surf-2); border-radius: 999px; padding: 3px 10px;
  font-variant-numeric: tabular-nums; font-weight: 500;
}
.stage--full .stage__n { background: var(--ok-dim); color: var(--ok); }
.stage__c { flex: 0 0 auto; color: var(--text-3); transition: transform .25s ease; }
.stage[data-open="true"] .stage__c { transform: rotate(90deg); }
.stage__bd { padding: 2px 16px 8px; border-top: 1px solid var(--hair-2); }
.stage[data-open="false"] .stage__bd { display: none; }
.stage__part {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-3); padding: 12px 0 4px;
}

.step { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair-2); }
.step:last-child { border-bottom: 0; }
.box {
  flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; padding: 0;
  border-radius: 7px; border: 1.5px solid var(--hair); background: var(--surf-2);
  cursor: pointer; display: grid; place-items: center; color: transparent;
}
.box:hover { border-color: var(--sig); }
.box[aria-checked="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.box svg { width: 13px; height: 13px; }
.step__b { min-width: 0; flex: 1 1 auto; }
.step__b b { display: block; font-size: 15px; font-weight: 600; }
.box[aria-checked="true"] + .step__b b { color: var(--text-3); text-decoration: line-through; }
.step__b p { margin: 3px 0 0; font-size: 13.5px; color: var(--text-2); line-height: 1.45; }
.step__go { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.pill {
  font-size: 12.5px; letter-spacing: -.006em;
  padding: 5px 11px; border-radius: 999px; cursor: pointer; font-weight: 500;
  background: var(--surf-2); border: 1px solid var(--hair); color: var(--text-2);
}
.pill:hover { border-color: var(--text-3); color: var(--text); text-decoration: none; }
.pill--on { background: var(--text); border-color: var(--text); color: var(--bg); }

/* ---------- reader ---------- */
.back {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
  background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 14px; font-weight: 500; letter-spacing: -.01em; color: var(--text-3);
}
.back:hover { color: var(--text); }
.doc { max-width: 68ch; }
.doc h2 { font-size: 19px; margin-top: 34px; }
.doc h3 { font-size: 16px; }
.doc ul, .doc ol { margin: 0 0 15px; padding-left: 21px; }
.doc li { margin-bottom: 7px; }
.doc li::marker { color: var(--text-3); }
.doc strong { font-weight: 600; color: var(--text); }
.doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 8px 0 20px; }
.doc th, .doc td { text-align: left; padding: 10px 11px; border-bottom: 1px solid var(--hair-2); vertical-align: top; }
.doc th {
  font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--hair);
}
.scr { overflow-x: auto; }
.hint {
  background: var(--surf-2); border: 1px solid var(--hair);
  padding: 15px 17px; border-radius: var(--r-s);
  margin: 0 0 20px; font-size: 15px; color: var(--text-2); line-height: 1.5;
}
.hint b { color: var(--text); font-weight: 600; }
.hint--alert { background: var(--alert-dim); border-color: transparent; }
.hint--alert b { color: var(--alert); }
.hint--ok { background: var(--ok-dim); border-color: transparent; }
.hint--ok b { color: var(--ok); }
.check { list-style: none; padding: 0; margin: 0 0 18px; }
.check li { position: relative; padding-left: 26px; margin-bottom: 8px; font-size: 14.5px; }
.check li::before {
  content: ""; position: absolute; left: 0; top: 4px; width: 15px; height: 15px;
  border: 1.5px solid var(--hair); border-radius: 4px;
}

/* ---------- lexikon ---------- */
.field {
  display: flex; align-items: center; gap: 10px; margin-bottom: 13px;
  background: var(--surf); border: 1px solid var(--hair); border-radius: 12px; padding: 11px 14px;
}
.field input { flex: 1 1 auto; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; min-width: 0; }
.field input::placeholder { color: var(--text-3); }
.field input:focus { outline: none; }
.field svg { color: var(--text-3); flex: 0 0 auto; width: 16px; height: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
.az { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 13px; }
.az button {
  font-size: 12.5px; font-weight: 500; min-width: 28px; height: 28px; padding: 0 7px;
  border-radius: 8px; border: 1px solid var(--hair); background: var(--surf);
  color: var(--text-2); cursor: pointer;
}
.az button:hover:not(:disabled) { border-color: var(--text-3); color: var(--text); }
.az button.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.az button:disabled { opacity: .28; cursor: default; }

.term { background: var(--surf); }
.term__hd {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 14px 18px; background: none; border: 0; text-align: left; cursor: pointer;
}
.term__hd:hover { background: var(--surf-2); }
.term__hd b { font-family: var(--f-disp); font-weight: 600; font-size: 16px; letter-spacing: -.016em; }
.term__hd i {
  font-style: normal; margin-left: auto; flex: 0 0 auto; white-space: nowrap;
  font-size: 11px; font-weight: 500; color: var(--text-3);
  background: var(--surf-2); border-radius: 6px; padding: 2px 8px;
}
.term__bd { padding: 0 18px 16px; font-size: 15px; color: var(--text-2); line-height: 1.5; }
.term[data-open="false"] .term__bd { display: none; }
.term__bd p { margin: 0 0 10px; }
.term__bd .why { color: var(--text); font-size: 13.5px; margin: 0; }
.term__bd .why b {
  display: block; margin-bottom: 3px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3);
}

/* ---------- förderung ---------- */
.fund { background: var(--surf); padding: 17px 18px; }
.fund__hd { display: flex; align-items: flex-start; gap: 10px; }
.fund__hd b { font-family: var(--f-disp); font-weight: 600; font-size: 16.5px; letter-spacing: -.018em; flex: 1 1 auto; }
.fund__tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0 0; }
.fund p { margin: 9px 0 0; font-size: 14.5px; color: var(--text-2); line-height: 1.45; letter-spacing: -.008em; }
.fund__meta {
  display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px;
  font-size: 12.5px; color: var(--text-3);
}
.fund__meta b { color: var(--text-2); font-weight: 500; }
.tag {
  font-size: 11px; font-weight: 500; letter-spacing: -.003em;
  padding: 3px 9px; border-radius: 7px; border: 1px solid transparent;
  background: var(--surf-3); color: var(--text-2); white-space: nowrap;
}
.tag--free { color: var(--ok); background: var(--ok-dim); font-weight: 600; }
.tag--art { color: var(--text); background: var(--surf-3); font-weight: 600; }
.tag--dead { color: var(--alert); background: var(--alert-dim); font-weight: 600; }

/* ---------- overlays ---------- */
.ovl {
  position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
  background: var(--blur); backdrop-filter: saturate(180%) blur(22px);
}
.ovl[hidden] { display: none !important; }
.ovl__bar {
  display: flex; align-items: center; gap: 10px; padding: 12px 15px;
  border-bottom: 1px solid var(--hair); max-width: 800px; margin: 0 auto; width: 100%;
}
.ovl__bar input {
  flex: 1 1 auto; min-width: 0; background: var(--surf); border: 1px solid var(--hair);
  border-radius: 12px; padding: 11px 14px; color: var(--text); font: inherit; font-size: 16px;
}
.ovl__bar input:focus { outline: none; border-color: var(--sig); }
.ovl__bar strong { font-family: var(--f-disp); font-size: 16px; font-weight: 600; }
.x {
  background: none; border: 0; cursor: pointer; flex: 0 0 auto; margin-left: auto;
  font-size: 15px; font-weight: 500; color: var(--sig);
}
.x:hover { opacity: .75; }
.ovl__bd { flex: 1 1 auto; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; padding: 14px 15px 20px; }
.hit {
  background: var(--surf); border: 0; width: 100%; text-align: left; cursor: pointer; padding: 13px 16px;
}
.hit:hover, .hit:focus-visible { background: var(--surf-2); }
.hit em {
  font-style: normal; display: block; margin-bottom: 3px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3);
}
.hit b { display: block; font-size: 15px; font-weight: 600; }
.hit span { display: block; font-size: 13px; color: var(--text-2); margin-top: 2px; }
.none { color: var(--text-3); font-size: 14.5px; padding: 26px 6px; text-align: center; }

.chat { display: flex; flex-direction: column; gap: 11px; }
.msg { max-width: 88%; padding: 12px 15px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.msg--me { align-self: flex-end; background: var(--sig); color: #fff; border-bottom-right-radius: 5px; }
.msg--ai { align-self: flex-start; background: var(--surf); border: 1px solid var(--hair); border-bottom-left-radius: 5px; }
.msg--sys { align-self: stretch; max-width: none; background: var(--surf-2); color: var(--text-2); font-size: 13.5px; }
.sugg { display: flex; flex-wrap: wrap; gap: 7px; }
.foot2 { border-top: 1px solid var(--hair); padding: 11px 15px; max-width: 800px; margin: 0 auto; width: 100%; display: flex; gap: 8px; }
.foot2 input {
  flex: 1 1 auto; min-width: 0; background: var(--surf); border: 1px solid var(--hair);
  border-radius: 12px; padding: 12px 14px; color: var(--text); font: inherit; font-size: 16px;
}
.foot2 input:focus { outline: none; border-color: var(--sig); }

.foot {
  max-width: 800px; margin: 44px auto 0; padding: 18px 17px 8px;
  border-top: 1px solid var(--hair-2); color: var(--text-3); font-size: 12px;
}
.foot p { margin: 0 0 7px; }

/* ---------- desktop ---------- */
@media (min-width: 940px) {
  .side { display: flex; }
  .top, .tabs { display: none; }
  .main { margin-left: var(--nav); padding-bottom: 44px; }
  .wrap { padding: 40px 36px 0; }
  .cards { grid-template-columns: 1fr 1fr; }
  .bay__in { grid-template-columns: 224px 1fr; gap: 28px; }
  .rocket { max-width: 224px; }
  .ask { bottom: 24px; right: 24px; height: 48px; }
  .foot { padding: 18px 36px 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
