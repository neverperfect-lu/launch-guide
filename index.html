<script>
/* ---- Lexikon: [Begriff, Bereich, Definition, Warum es für dich zählt] ---- */
var TERMS = [
['Abschreibung','Buchhaltung','Verteilung der Kosten einer Investition über ihre Nutzungsdauer statt als Einmalaufwand.','Macht aus 12.000 € Hardware buchhalterisch 3 × 4.000 € — verändert den Gewinn, nicht den Cashflow.'],
['Accelerator','Programm','Zeitlich begrenztes Programm mit Mentoring, Workshops und oft Kapital gegen Anteile.','Sinnvoll mit Traction. Ohne Traction ist ein kostenloser Inkubator meist der bessere Deal.'],
['Acceptance Criteria','Vertrag','Messbare Kriterien, wann ein Deliverable als abgenommen gilt.','Ohne sie streitest du am Projektende darüber, ob "fertig" fertig ist.'],
['AGG','People','Allgemeines Gleichbehandlungsgesetz — verbietet Diskriminierung im Arbeitsverhältnis.','Gilt schon für die Stellenausschreibung: "junges Team" in der Anzeige ist ein Klagerisiko.'],
['Angel','Kapital','Privatperson, die eigenes Geld in junge Unternehmen investiert, meist 25–250 T€.','Oft das erste Equity-Geld nach Förderung. Erfahrung und Netzwerk zählen mehr als der Betrag.'],
['Anti-Dilution','Term Sheet','Schutzklausel, die Investoren bei einer niedrigeren Folgebewertung zusätzliche Anteile gibt.','"Broad-based weighted average" ist marktüblich, "full ratchet" ist ein Warnsignal.'],
['ARPU','Metrik','Average Revenue per User — Umsatz geteilt durch Anzahl Kund:innen.','Zeigt, ob Wachstum aus mehr Kunden oder aus höheren Preisen kommt.'],
['ARR','Metrik','Annual Recurring Revenue — auf ein Jahr hochgerechneter wiederkehrender Umsatz.','Nur bei echten Abos aussagekräftig. Einmalprojekte gehören nicht hinein.'],
['Arbitration','Vertrag','Schiedsgerichtsverfahren als Alternative zum ordentlichen Gericht.','Schneller (6–12 Monate) und vertraulich, aber teuer: 20–100 T€ Verfahrenskosten.'],
['Aufbewahrungspflicht','Buchhaltung','Gesetzliche Pflicht, Unterlagen aufzubewahren: 10 Jahre für Bücher und Belege, 6 Jahre für Geschäftsbriefe.','Digital ist erlaubt, aber unveränderbar. Ein gelöschtes Postfach kann teuer werden.'],
['AVV','Datenschutz','Auftragsverarbeitungsvertrag mit jedem Dienstleister, der personenbezogene Daten für dich verarbeitet.','Betrifft fast jedes Tool: Newsletter, CRM, Hosting, Analytics. Enterprise-Kunden fragen danach.'],
['Background IP','IP','Vorbestehende geistige Eigentumsrechte — bleiben beim ursprünglichen Eigentümer.','Im Kundenvertrag klar von Foreground IP trennen, sonst verschenkst du deine Plattform.'],
['Bad Leaver','Recht','Gesellschafter, der unter negativen Umständen ausscheidet — verliert typischerweise mehr Anteile.','Die Definition entscheidet, ob eine Trennung teuer oder existenzbedrohend wird.'],
['Bilanz','Buchhaltung','Momentaufnahme: Was besitzt das Unternehmen (Aktiva), woher kommt das Geld (Passiva)?','Pflicht für UG, GmbH und AG. Zeigt, ob du überschuldet bist — das entscheidet über Insolvenzantragspflicht.'],
['Bootstrapping','Kapital','Wachstum aus eigenen Umsätzen und Ersparnissen, ohne externes Kapital.','Der einzige Weg ohne Verwässerung — und der schnellste Weg zu Kostendisziplin.'],
['Break-Even','Metrik','Punkt, an dem Einnahmen die Kosten decken. Fixkosten ÷ Deckungsbeitrag pro Einheit.','Als Stückzahl ausgedrückt oft aufschlussreicher als jede Umsatzprognose.'],
['Bridge','Kapital','Zwischenfinanzierung bis zur nächsten Runde, meist als Wandeldarlehen.','Wer eine Bridge braucht, hat oft zu spät mit dem Fundraising angefangen.'],
['Burn Rate','Metrik','Netto-Geldverbrauch pro Monat: Ausgaben minus Einnahmen.','Zusammen mit dem Kontostand ergibt sie den Runway. Die wichtigste Zahl, wenn es knapp wird.'],
['Business Model Canvas','Methode','Einseitige Übersicht über neun Bausteine eines Geschäftsmodells.','Gut für gemeinsame Sprache im Team, kein Ersatz für Kundengespräche.'],
['CAC','Metrik','Customer Acquisition Cost — was ein zahlender Kunde in der Akquise kostet.','Alle Marketing- und Vertriebskosten ÷ neue zahlende Kund:innen. Nicht nur Werbebudget.'],
['CAC Payback','Metrik','Monate, bis ein Kunde die Akquisekosten zurückverdient hat.','Unter 12 Monaten ist gut. Länger heißt: Wachstum frisst deinen Cash.'],
['Cap','Vertrag','Haftungsobergrenze im Vertrag, typisch 1× Jahresgebühr.','Ohne Cap kann ein einzelner Bug existenzbedrohend werden.'],
['Cap Table','Recht','Tabelle aller Anteilseigner mit Anteilen, Klassen, Optionen und Wandeldarlehen.','Das erste Dokument, das ein Investor sehen will. Frühe Fehler bleiben dauerhaft sichtbar.'],
['Cashflow','Buchhaltung','Tatsächlicher Geldfluss, getrennt in operativ, Investition und Finanzierung.','Gewinn ≠ Cash: Du kannst profitabel sein und trotzdem pleite gehen.'],
['Churn','Metrik','Anteil der Kund:innen oder des Umsatzes, der pro Periode wegfällt.','Bei hohem Churn ist Neukundengewinnung ein Fass ohne Boden — erst Retention reparieren.'],
['CISG','Vertrag','UN-Kaufrecht für internationale Warenkäufe.','Sollte in Verträgen ausdrücklich ausgeschlossen werden, sonst gilt es automatisch.'],
['Cliff','Recht','Anfangszeitraum eines Vesting, in dem noch nichts erdient wird — üblich ein Jahr.','Schützt das Team davor, dass jemand nach drei Monaten mit einem Drittel der Firma geht.'],
['Consequential Damages','Vertrag','Folgeschäden wie entgangene Gewinne.','Sollten im Vertrag ausgeschlossen werden — sonst haftest du für den Umsatzausfall deines Kunden.'],
['Convertible','Kapital','Wandeldarlehen: Darlehen, das in der nächsten Runde in Anteile wandelt.','In Deutschland der Standardweg für schnelles Pre-Seed-Geld ohne sofortige Bewertung.'],
['Corporate Venture','Kapital','Beteiligungsarm eines Konzerns mit strategischem Interesse.','Bringt Marktzugang, kann aber andere Investoren abschrecken. Exklusivitätsklauseln genau lesen.'],
['D&O','Versicherung','Directors-&-Officers-Versicherung für die persönliche Haftung von Geschäftsführung und Vorstand.','Geschäftsführer haften bei Pflichtverletzungen persönlich und unbegrenzt — mit dem Privatvermögen.'],
['DCF','Kapital','Discounted Cash Flow — Bewertung über abdiskontierte künftige Cashflows.','In der Frühphase kaum brauchbar, weil die Cashflows frei erfunden sind.'],
['Deckungsbeitrag','Metrik','Umsatz minus variable Kosten pro Einheit.','Sagt, ob jeder zusätzliche Verkauf dich näher an den Break-Even bringt oder weiter weg.'],
['Deliverable','Vertrag','Konkrete Lieferung mit messbaren Abnahmekriterien.','Im SOW einzeln auflisten — inklusive was ausdrücklich nicht dazugehört.'],
['Demo Day','Programm','Abschlussveranstaltung eines Programms mit Pitches vor Jury und Investor:innen.','Der eigentliche Wert ist nicht der Preis, sondern die Kontakte im Raum.'],
['Down Round','Kapital','Finanzierungsrunde mit niedrigerer Bewertung als die vorherige.','Meist die Folge einer zu hoch angesetzten ersten Runde. Ein Grund, Bewertung nicht zu maximieren.'],
['Drag Along','Term Sheet','Pflicht der Minderheit, bei einem Mehrheitsverkauf mitzuverkaufen.','Marktüblich. Entscheidend sind die Schwellen, ab denen sie greift.'],
['DSGVO','Datenschutz','EU-Datenschutzgrundverordnung — Regeln für die Verarbeitung personenbezogener Daten.','Betrifft dich ab dem ersten Kontaktformular: Datenschutzerklärung, AVV, Verarbeitungsverzeichnis.'],
['Due Diligence','Kapital','Systematische Prüfung von Recht, Finanzen, Technik und Team vor einem Investment.','Ein vorbereiteter Datenraum verkürzt sie von Monaten auf Wochen.'],
['EBIT','Metrik','Ergebnis vor Zinsen und Steuern — operativer Gewinn.','Zeigt, ob das Geschäft selbst trägt, unabhängig von Finanzierung und Steuerlast.'],
['EBITDA','Metrik','EBIT zusätzlich vor Abschreibungen und Amortisation.','Näherung an den operativen Cashflow — beliebt bei Bewertungen über Multiples.'],
['E-Rechnung','Buchhaltung','Strukturierte elektronische Rechnung (z. B. XRechnung, ZUGFeRD) statt PDF.','Im deutschen B2B gestaffelt verpflichtend — empfangen können musst du sie bereits.'],
['eGbR','Recht','Im Gesellschaftsregister eingetragene GbR, seit 2024 möglich.','Bringt Registerpublizität und ist nötig, wenn die GbR Grundbesitz oder Anteile halten soll.'],
['Einwilligung','Datenschutz','Freiwillige, informierte Zustimmung zur Datenverarbeitung.','Muss so leicht widerrufbar sein wie erteilbar — ein Banner nur mit "OK" genügt nicht.'],
['ELSTER','Behörden','Elektronisches Portal der Finanzverwaltung für Steuererklärungen und Anmeldungen.','Der Fragebogen zur steuerlichen Erfassung läuft darüber — der Startpunkt jeder Steuerpflicht.'],
['ESOP','People','Mitarbeiterbeteiligung über echte Optionen auf Anteile.','In Deutschland selten, weil echte Anteile bei Gewährung steuerpflichtig sein können.'],
['EÜR','Buchhaltung','Einnahmen-Überschuss-Rechnung — einfache Gewinnermittlung nach Zu- und Abfluss.','Erlaubt für Einzelunternehmen, GbR und Freiberufler unter den Grenzen. Kapitalgesellschaften müssen bilanzieren.'],
['EXIST','Förderung','Bundesprogramm für Gründungen aus Hochschulen: Gründerstipendium und Forschungstransfer.','Antrag läuft über die Hochschule, nicht direkt — die Transferstelle ist die erste Adresse.'],
['Exit','Kapital','Verkauf des Unternehmens oder Börsengang.','Das Geschäftsmodell deiner Investoren. Erklärt, warum sie große Märkte brauchen.'],
['Exklusivität','Term Sheet','Verpflichtung, für eine Zeit nur mit einer Partei zu verhandeln.','30–60 Tage sind normal. Mehrere Monate ohne Gegenleistung sind ein Warnsignal.'],
['Force Majeure','Vertrag','Höhere Gewalt — unvorhersehbare Ereignisse, die von der Leistungspflicht befreien.','Ohne diese Klausel haftest du für Nicht-Lieferung auch bei Pandemie, Krieg oder Naturkatastrophe.'],
['Foreground IP','IP','Neu entwickelte IP im Rahmen eines Projekts.','Geht typischerweise an den Kunden — anders regeln, wenn es Teil deines Produkts werden soll.'],
['Gewerbesteuer','Steuern','Gemeindesteuer auf den Gewerbeertrag: 3,5 % Messzahl × Hebesatz der Gemeinde.','Der Hebesatz variiert stark — bei der Sitzwahl mitrechnen.'],
['GoBD','Buchhaltung','Grundsätze der Finanzverwaltung zur ordnungsmäßigen Führung digitaler Bücher und Belege.','Praktisch: Belege digital, unveränderbar, nachvollziehbar. Ab der ersten Rechnung relevant.'],
['Good Leaver','Recht','Gesellschafter, der unter akzeptierten Umständen ausscheidet und Erdientes behält.','Die Abgrenzung zum Bad Leaver gehört in die Gesellschaftervereinbarung, nicht in ein Gespräch danach.'],
['Governing Law','Vertrag','Rechtswahl — welches Recht für den Vertrag gilt.','Deutsches Recht ist dein Heimvorteil; fremdes Recht bedeutet teure Einarbeitung.'],
['Gross Margin','Metrik','Bruttomarge: Rohertrag ÷ Umsatz.','Bei SaaS die zentrale Qualitätskennzahl — unter 70 % fragen Investor:innen nach.'],
['GuV','Buchhaltung','Gewinn- und Verlustrechnung: wie viel Gewinn oder Verlust in der Periode entstanden ist.','Monatlich ansehen, nicht erst beim Jahresabschluss.'],
['Handelsregister','Behörden','Öffentliches Register beim Amtsgericht für Kaufleute und Kapitalgesellschaften.','Mit der Eintragung endet die persönliche Haftung für neue Verbindlichkeiten der Gesellschaft.'],
['Hebesatz','Steuern','Prozentsatz der Gemeinde zur Berechnung der Gewerbesteuer.','Unterscheidet sich je Standort deutlich — ein Standortfaktor, der oft übersehen wird.'],
['IFRS','Buchhaltung','Internationale Rechnungslegungsstandards, investororientiert.','Erst bei internationalen Investoren oder Börsenplänen relevant; sonst reicht HGB.'],
['Indemnification','Vertrag','Freistellung — Verpflichtung, die andere Partei schadlos zu halten.','Meist bei IP-Verletzungen. Unbegrenzte Freistellung ist gefährlich, immer cappen.'],
['Inkubator','Programm','Einrichtung, die sehr frühe Vorhaben mit Raum, Beratung und Netzwerk begleitet.','Meist kostenlos und ohne Equity — der günstigste Einstieg vor einem Accelerator.'],
['Insolvenzverschleppung','Recht','Verspäteter Insolvenzantrag trotz Zahlungsunfähigkeit oder Überschuldung.','Geschäftsführer haften persönlich und machen sich strafbar. Fristen sind kurz.'],
['IP','IP','Intellectual Property — Marken, Patente, Urheberrechte, Know-how.','Muss der Gesellschaft gehören, nicht einzelnen Personen. Häufigster Fund in der Due Diligence.'],
['Kleinunternehmerregelung','Steuern','Wahlrecht nach § 19 UStG: keine Umsatzsteuer auf Rechnungen, dafür kein Vorsteuerabzug.','Seit 2025: bis 25.000 € Vorjahresumsatz und 100.000 € im laufenden Jahr.'],
['Körperschaftsteuer','Steuern','Steuer auf den Gewinn von Kapitalgesellschaften: 15 % plus Solidaritätszuschlag.','Mit Gewerbesteuer landet eine UG oder GmbH bei etwa 30 % Gesamtbelastung.'],
['Lead Investor','Kapital','Investor, der eine Runde anführt, das Term Sheet setzt und die Due Diligence treibt.','Ohne Lead kommt eine Runde selten zustande — ihn zu finden ist der eigentliche Engpass.'],
['Lean Canvas','Methode','Einseitiges Modell mit Fokus auf Problem, Lösung und unfairem Vorteil.','Schneller als der Business Model Canvas und besser für sehr frühe Ideen.'],
['Liquidationspräferenz','Term Sheet','Regel, wer beim Exit zuerst wie viel bekommt.','1× non-participating ist marktüblich. Alles darüber verschiebt den Erlös deutlich zum Investor.'],
['Liquiditätsplan','Metrik','Monatliche Planung der tatsächlichen Zahlungsein- und -ausgänge.','Der Umsatzplan sagt, wann du Rechnungen stellst. Der Liquiditätsplan, wann das Geld ankommt.'],
['LOI','Vertrag','Letter of Intent — unverbindliche Absichtserklärung vor dem finalen Vertrag.','Meist nicht bindend, außer Vertraulichkeit, Exklusivität und Kostentragung.'],
['LTV','Metrik','Lifetime Value — Deckungsbeitrag über die gesamte Kundenbeziehung.','Verglichen mit CAC: über 3 gilt als tragfähig. In der Frühphase unzuverlässig.'],
['Material Breach','Vertrag','Wesentliche Vertragsverletzung.','Berechtigt zur außerordentlichen Kündigung — die Klausel, die dich aus einem toten Vertrag holt.'],
['Minijob','People','Geringfügige Beschäftigung unterhalb einer an den Mindestlohn gekoppelten Verdienstgrenze.','Anmeldung bei der Minijob-Zentrale. Die Grenze steigt jährlich — vor jeder Einstellung prüfen.'],
['MRR','Metrik','Monthly Recurring Revenue — wiederkehrender Monatsumsatz.','Die ehrlichste Wachstumszahl bei Abos, weil Einmaleffekte herausfallen.'],
['MSA','Vertrag','Master Services Agreement — Rahmenvertrag für langfristige Zusammenarbeit.','Einmal verhandeln, viele Projekte über SOWs abwickeln. Spart bei Wiederholkunden viel Zeit.'],
['Musterprotokoll','Recht','Vereinfachter Standardgesellschaftsvertrag für bis zu drei Gesellschafter und einen Geschäftsführer.','Günstiger beim Notar, aber ohne Vesting und Sonderrechte — bei Investorenplänen ungeeignet.'],
['MVP','Methode','Minimum Viable Product — kleinste Version, mit der eine Annahme getestet wird.','Landing Page, Klickdummy oder manueller Concierge-Service zählen dazu.'],
['NDA','Vertrag','Vertraulichkeitsvereinbarung, einseitig oder gegenseitig.','Sparsam einsetzen: die meisten Investor:innen unterschreiben keine, und die Idee ist selten das Geheimnis.'],
['Notar','Recht','Für Gründung und Anteilsübertragungen bei UG und GmbH zwingend erforderlich.','Auch jede Kapitalerhöhung läuft über den Notar — Kosten in der Runde mitplanen.'],
['NRR','Metrik','Net Revenue Retention — Umsatzentwicklung der Bestandskunden inklusive Upgrades.','Über 100 % heißt: du wächst auch ohne Neukunden. Die stärkste SaaS-Kennzahl.'],
['Order Form','Vertrag','Einfaches Bestellformular für Standardprodukte und SaaS-Abos.','Nicht geeignet für komplexe Projekte oder Custom Development.'],
['OSS-Verfahren','International','One-Stop-Shop: zentrale Meldung der EU-Umsatzsteuer für B2C-Verkäufe.','Erspart die Registrierung in jedem einzelnen EU-Land. Ab 10.000 € Fernverkaufsumsatz relevant.'],
['Out-of-Scope','Vertrag','Was ausdrücklich nicht Teil des Projekts ist.','Der wirksamste Schutz gegen Scope Creep — im SOW genauso ausführlich wie der Scope.'],
['Patent','IP','Gewerbliches Schutzrecht für technische Erfindungen, max. 20 Jahre.','Neuheit ist Voraussetzung: wer vorher öffentlich pitcht, verliert die Patentierbarkeit.'],
['Pivot','Methode','Grundlegende Änderung von Produkt, Zielgruppe oder Geschäftsmodell auf Basis von Gelerntem.','Kein Scheitern, sondern das Ergebnis funktionierender Validierung.'],
['Post-Money','Kapital','Unternehmenswert nach Einzahlung des neuen Kapitals.','Pre-Money plus Investment. Wer beides verwechselt, verhandelt Prozentpunkte weg.'],
['Pre-Money','Kapital','Unternehmenswert vor der Investition.','Immer explizit klären, welche der beiden Zahlen im Term Sheet gemeint ist.'],
['Pre-Seed','Kapital','Erste kleine Finanzierungsphase, oft vor messbarem Umsatz.','Typisch: Förderung, Angels, Wandeldarlehen. Team und Problem stehen im Mittelpunkt.'],
['Product-Market-Fit','Methode','Zustand, in dem der Markt das Produkt erkennbar zieht.','Retention ist das verlässlichste Signal. Vorher skalieren verbrennt Geld.'],
['Pro-Rata','Term Sheet','Recht eines Investors, in Folgerunden anteilig mitzuinvestieren.','Marktüblich. Nur bei sehr vielen Kleininvestoren später unpraktisch.'],
['Reverse Charge','International','Bei B2B-Leistungen in der EU schuldet der Kunde die Umsatzsteuer.','USt-IdNr. beider Seiten prüfen und auf der Rechnung nennen, sonst haftest du für die Steuer.'],
['Retention','Metrik','Anteil der Nutzer:innen, die nach einer bestimmten Zeit noch aktiv sind.','Die wichtigste Frühphasen-Kurve: es wächst nur, was bleibt.'],
['Runway','Metrik','Zeit bis zur Zahlungsunfähigkeit: Kontostand ÷ Burn Rate.','Unter zwölf Monaten verhandelst du aus der Schwäche — Fundraising dauert selbst 3–6 Monate.'],
['SAFE','Kapital','Simple Agreement for Future Equity — US-Instrument, das später in Anteile wandelt.','In Deutschland unüblich; hier fast immer ein Wandeldarlehen. Die Begriffe werden oft vermischt.'],
['Scheinselbstständigkeit','People','Ein formal Selbstständiger arbeitet faktisch wie ein Angestellter.','Nachzahlung von Sozialabgaben trifft rückwirkend das Unternehmen. Statusfeststellungsverfahren nutzen.'],
['Scope Creep','Vertrag','Unkontrollierte Ausweitung des Projektumfangs.','Ohne Change-Request-Prozess arbeitest du unbezahlt weiter. Im SOW festschreiben.'],
['Seed','Kapital','Finanzierungsphase nach Pre-Seed, in der erste Traction vorliegt.','Ab etwa 500 T€, meist mit Lead-VC und formaler Due Diligence.'],
['Severability','Vertrag','Salvatorische Klausel — unwirksame Klauseln machen den Vertrag nicht insgesamt ungültig.','Standardklausel, die niemand liest und die im Streitfall den Vertrag rettet.'],
['SLA','Vertrag','Service Level Agreement über messbare Servicequalität mit Kompensation.','Ein SLA ohne Service Credits ist Marketing. Typisch: 99,9 % Uptime, 1 h Reaktion bei Critical.'],
['SOW','Vertrag','Statement of Work — konkrete Projektbeschreibung unter einem MSA.','Scope, Deliverables, Acceptance Criteria, Preise, Change-Request-Prozess.'],
['Stammkapital','Recht','Eigenkapital, das Gesellschafter bei Gründung einer Kapitalgesellschaft einbringen.','GmbH 25.000 € (mind. 12.500 € eingezahlt), UG ab 1 € — praktisch mehr.'],
['Statusfeststellung','People','Verfahren der Deutschen Rentenversicherung zur Klärung, ob Selbstständigkeit vorliegt.','Der günstige Weg, Scheinselbstständigkeit auszuschließen, bevor die Prüfung kommt.'],
['TAM / SAM / SOM','Methode','Gesamtmarkt, erreichbarer Markt, realistisch erzielbarer Anteil.','Bottom-up rechnen: Anzahl Kund:innen × Jahresumsatz. Studienzahlen überzeugen niemanden.'],
['Tag Along','Term Sheet','Recht der Minderheit, bei einem Mehrheitsverkauf zu gleichen Bedingungen mitzuverkaufen.','Schutz für kleine Anteilseigner — Gegenstück zum Drag Along.'],
['Term Sheet','Term Sheet','Unverbindliche Zusammenfassung der Konditionen eines Investments.','Prägt den späteren Beteiligungsvertrag fast vollständig. Nie ohne Kanzlei unterschreiben.'],
['TOMs','Datenschutz','Technische und organisatorische Maßnahmen zum Schutz personenbezogener Daten.','Verschlüsselung, Zugriffskonzept, Backups — dokumentiert, weil Enterprise-Kunden danach fragen.'],
['Traction','Metrik','Messbarer Fortschritt: Nutzung, Umsatz, Wiederkehr, Pilotkunden.','Der stärkste Beleg im Pitch. Die Kurve über Wochen zählt mehr als der absolute Wert.'],
['Trade Secret','IP','Geschäftsgeheimnis als Alternative zum Patent.','Nur geschützt, wenn du angemessene Geheimhaltungsmaßnahmen nachweisen kannst.'],
['Unit Economics','Metrik','Deckungsbeitrag pro Einheit oder Kunde — verdient ein einzelner Kunde Geld?','Sagt, ob Wachstum dein Problem löst oder vergrößert.'],
['USt-IdNr.','Steuern','Umsatzsteuer-Identifikationsnummer für innergemeinschaftliche Geschäfte.','Auf Antrag beim Finanzamt. Ohne sie kein sauberes EU-B2B-Geschäft.'],
['Vanity Metric','Metrik','Kennzahl, die gut aussieht und nichts über den Zustand des Geschäfts sagt.','Registrierungen, Downloads, Follower. Steigen immer, auch wenn nichts funktioniert.'],
['Venture Debt','Kapital','Fremdkapital für Startups, meist nach einer VC-Runde, mit Zinsen und Warrants.','Verwässert kaum, ist aber teuer und mit Covenants verbunden. Kein Ersatz für Equity.'],
['Verwässerung','Kapital','Sinken des prozentualen Anteils, wenn neue Anteile ausgegeben werden.','Normal, solange der Kuchen wächst. Problematisch nur, wenn du früh zu viel abgibst.'],
['Vesting','Recht','Anteile werden über Zeit erdient, meist vier Jahre mit einem Jahr Cliff.','Ohne Vesting bist du für Investor:innen praktisch unfinanzierbar.'],
['Vetorecht','Term Sheet','Zustimmungsvorbehalt eines Investors für bestimmte Beschlüsse.','Bei Grundlagengeschäften normal. Auf Alltagsentscheidungen ein Warnsignal.'],
['Vorsteuer','Steuern','Umsatzsteuer, die du selbst gezahlt hast und mit der eingenommenen verrechnest.','Wer die Kleinunternehmerregelung wählt, verzichtet darauf — bei hohen Investitionen teuer.'],
['VSOP','People','Virtuelle Mitarbeiterbeteiligung, rein vertraglich, Auszahlung im Exit-Fall.','In Deutschland der Standard, weil kein Notar nötig ist und die Steuer erst bei Auszahlung anfällt.'],
['VVT','Datenschutz','Verzeichnis von Verarbeitungstätigkeiten — interne Übersicht aller Datenverarbeitungen.','Pflicht, auch für kleine Teams. Das erste Dokument, das eine Aufsichtsbehörde anfragt.'],
['Wandeldarlehen','Kapital','Darlehen, das in der nächsten Runde zu vereinbarten Konditionen in Anteile wandelt.','Schnell und ohne sofortige Bewertung. Cap und Discount sind die entscheidenden Zahlen.'],
['Warranty','Vertrag','Gewährleistung — Zusicherung bestimmter Eigenschaften.','Zeitlich begrenzen (30–90 Tage). "Bug-free forever" ist nicht erfüllbar.'],
['Werkstudent','People','Studentische Beschäftigung mit Sozialversicherungsprivileg.','Im Semester max. 20 h/Woche, dann nur Rentenversicherung. Immatrikulationsnachweis führen.']

['Bridge','Capital','Interim financing until the next round, usually a convertible loan.','Needing a bridge often means fundraising started too late.'],
['Burn rate','Metrics','Net cash consumption per month: expenses minus income.','Together with your bank balance it gives you the runway. The number that matters when things get tight.'],
['Business Model Canvas','Method','A one-page overview of nine building blocks of a business model.','Good for a shared language in the team, no substitute for customer conversations.'],
['CAC','Metrics','Customer acquisition cost — what one paying customer costs to acquire.','All marketing and sales costs ÷ new paying customers. Not just ad spend.'],
['CAC payback','Metrics','The number of months until a customer has earned back their acquisition cost.','Under 12 months is good. Longer means growth is eating your cash.'],
['Liability cap','Contracts','The maximum damages under a contract, typically 1× the annual fee.','Without a cap, a single bug can become existential.'],
['Cap table','Legal','A table of all shareholders with shares, classes, options and convertibles.','The first document an investor asks for. Early mistakes stay visible for good.'],
['Cash flow','Accounting','Actual movement of money, split into operating, investing and financing.','Profit ≠ cash: you can be profitable and still go bust.'],
['Churn','Metrics','The share of customers or revenue lost per period.','With high churn, new customer acquisition is a bottomless pit — fix retention first.'],
['CISG','Contracts','The UN Convention on Contracts for the International Sale of Goods.','Should be expressly excluded in contracts, otherwise it applies automatically.'],
['Cliff','Legal','The initial period of a vesting schedule during which nothing vests — usually one year.','Protects the team from someone walking away after three months with a third of the company.'],
['Consequential damages','Contracts','Indirect losses such as lost profits.','Should be excluded, otherwise you are liable for your client\'s lost revenue.'],
['Convertible loan','Capital','A loan that converts into shares in the next round.','In Germany the standard route for fast pre-seed money without setting a valuation yet.'],
['Corporate venture','Capital','The investment arm of a corporation, with strategic interest.','Brings market access but can deter other investors. Read exclusivity clauses carefully.'],
['D&O insurance','Insurance','Directors and officers cover for the personal liability of management.','Managing directors are personally and unlimitedly liable for breaches of duty — with private assets.'],
['DCF','Capital','Discounted cash flow — valuation based on discounted future cash flows.','Barely usable early on, because the cash flows are invented.'],
['Contribution margin','Metrics','Revenue minus variable costs per unit.','Tells you whether each additional sale moves you towards break-even or away from it.'],
['Deliverable','Contracts','A concrete output with measurable acceptance criteria.','List them individually in the SOW — including what is explicitly out of scope.'],
['Demo day','Programme','The closing event of a programme, with pitches to a jury and investors.','The real value is not the prize but the people in the room.'],
['Down round','Capital','A financing round at a lower valuation than the previous one.','Usually the consequence of pricing the first round too high. A reason not to maximise valuation.'],
['Drag along','Term sheet','An obligation on the minority to sell alongside a majority sale.','Market standard. What matters are the thresholds that trigger it.'],
['GDPR','Privacy','The EU General Data Protection Regulation governing processing of personal data.','Applies from your first contact form: privacy policy, processing agreements, records of processing.'],
['Due diligence','Capital','A systematic review of legal, financial, technical and team matters before an investment.','A prepared data room shortens it from months to weeks.'],
['EBIT','Metrics','Earnings before interest and taxes — operating profit.','Shows whether the business itself works, independent of financing and tax.'],
['EBITDA','Metrics','EBIT before depreciation and amortisation as well.','A proxy for operating cash flow — popular for multiple-based valuations.'],
['E-invoicing','Accounting','Structured electronic invoices (e.g. XRechnung, ZUGFeRD) instead of PDFs.','Becoming mandatory in German B2B in stages — you must already be able to receive them.'],
['Registered GbR','Legal','A partnership entered in the German companies register, possible since 2024.','Gives register publicity and is required if the partnership is to hold real estate or shares.'],
['Consent','Privacy','Freely given, informed agreement to data processing.','Must be as easy to withdraw as to give — a banner with only "OK" is not enough.'],
['ELSTER','Authorities','The German tax administration\'s electronic portal for returns and registrations.','The tax registration questionnaire runs through it — the starting point of every tax obligation.'],
['ESOP','People','Employee participation through real options on shares.','Rare in Germany, because real shares can be taxable when granted.'],
['Cash-basis accounting','Accounting','Simple profit calculation based on money received and paid (Einnahmen-Überschuss-Rechnung).','Permitted for sole traders, partnerships and freelancers below the thresholds. Corporations must prepare a balance sheet.'],
['EXIST','Funding','A German federal programme for university spin-offs: a founder fellowship and research transfer track.','The application goes through the university, not directly — the transfer office is your first stop.'],
['Exit','Capital','Sale of the company or an IPO.','Your investors\' business model. Explains why they need large markets.'],
['Exclusivity','Term sheet','An obligation to negotiate with only one party for a period.','30–60 days is normal. Several months without consideration is a red flag.'],
['Force majeure','Contracts','Unforeseeable events that release a party from performance.','Without this clause you are liable for non-delivery even in a pandemic, war or natural disaster.'],
['Foreground IP','IP','IP newly created within a project.','Typically goes to the client — negotiate differently if it is to become part of your product.'],
['Trade tax','Tax','A municipal tax on trade income: a 3.5 % base rate × the municipality\'s multiplier.','Multipliers vary a lot — factor it in when choosing your registered office.'],
['GoBD','Accounting','German tax authority principles for keeping digital books and records.','In practice: receipts digital, tamper-proof, traceable. Relevant from your first invoice.'],
['Good leaver','Legal','A shareholder leaving under accepted circumstances who keeps what has vested.','The line between this and a bad leaver belongs in the shareholders agreement, not in a conversation afterwards.'],
['Governing law','Contracts','Which law applies to the contract.','German law is your home advantage; foreign law means expensive learning.'],
['Gross margin','Metrics','Gross profit ÷ revenue.','For SaaS the key quality metric — below 70 % investors will ask questions.'],
['Profit and loss account','Accounting','How much profit or loss arose in the period.','Review it monthly, not just at the annual close.'],
['Commercial register','Authorities','The public register at the local court for merchants and corporations.','Registration is what ends personal liability for the company\'s new obligations.'],
['Trade tax multiplier','Tax','The percentage a municipality applies to calculate trade tax.','Differs noticeably by location — a site factor that is often overlooked.'],
['IFRS','Accounting','International, investor-oriented accounting standards.','Only relevant with international investors or IPO plans; otherwise German HGB is enough.'],
['Indemnification','Contracts','An obligation to hold the other party harmless.','Usually for IP infringement. Unlimited indemnity is dangerous — always cap it.'],
['Incubator','Programme','An organisation supporting very early ventures with space, advice and network.','Usually free and without equity — the cheapest entry before an accelerator.'],
['Delayed insolvency filing','Legal','Filing for insolvency too late despite illiquidity or over-indebtedness.','Managing directors are personally liable and commit a criminal offence. The deadlines are short.'],
['IP','IP','Intellectual property — trademarks, patents, copyright, know-how.','Must belong to the company, not to individuals. The most common due-diligence finding.'],
['Small-business rule','Tax','An election under § 19 UStG: no VAT on invoices, but no input VAT deduction either.','Since 2025: up to 25,000 € prior-year revenue and 100,000 € in the current year.'],
['Corporate income tax','Tax','Tax on the profit of corporations: 15 % plus solidarity surcharge.','With trade tax, a UG or GmbH lands at roughly 30 % total.'],
['Lead investor','Capital','The investor who leads a round, sets the term sheet and drives due diligence.','Without a lead a round rarely happens — finding one is the real bottleneck.'],
['Lean Canvas','Method','A one-page model focused on problem, solution and unfair advantage.','Faster than the Business Model Canvas and better for very early ideas.'],
['Liquidation preference','Term sheet','The rule for who gets how much first in an exit.','1× non-participating is market standard. Anything more shifts proceeds noticeably to the investor.'],
['Liquidity plan','Metrics','Monthly planning of actual cash in- and outflows.','The revenue plan says when you invoice. The liquidity plan says when the money arrives.'],
['LOI','Contracts','Letter of intent — a non-binding declaration before the final contract.','Usually non-binding, except for confidentiality, exclusivity and costs.'],
['LTV','Metrics','Lifetime value — contribution margin over the whole customer relationship.','Compared with CAC: above 3 is considered viable. Unreliable in the early phase.'],
['Material breach','Contracts','A fundamental breach of contract.','Grounds for termination for cause — the clause that gets you out of a dead contract.'],
['Mini-job','People','Marginal employment below an earnings threshold tied to the minimum wage.','Register with the Minijob-Zentrale. The threshold rises annually — check before every hire.'],
['MRR','Metrics','Monthly recurring revenue.','The most honest growth number for subscriptions, because one-offs drop out.'],
['MSA','Contracts','Master services agreement — a framework contract for long-term collaboration.','Negotiate once, run many projects through SOWs. Saves a lot of time with repeat clients.'],
['Model protocol','Legal','A simplified standard articles of association for up to three shareholders and one managing director.','Cheaper at the notary, but no vesting or special rights — unsuitable with investor plans.'],
['MVP','Method','Minimum viable product — the smallest version that tests one assumption.','A landing page, clickable prototype or manual concierge service all count.'],
['NDA','Contracts','A confidentiality agreement, one-way or mutual.','Use sparingly: most investors will not sign one, and the idea is rarely the secret.'],
['Notary','Legal','Mandatory for incorporation and share transfers of a UG or GmbH.','Every later capital increase goes through the notary too — budget for it in the round.'],
['NRR','Metrics','Net revenue retention — how existing customers\' revenue develops, including upgrades.','Above 100 % means you grow without new customers. The strongest SaaS metric.'],
['Order form','Contracts','A simple order document for standard products and SaaS subscriptions.','Not suitable for complex projects or custom development.'],
['OSS scheme','International','One-stop shop: central reporting of EU VAT for B2C sales.','Saves registering in every EU country. Relevant above 10,000 € of distance sales.'],
['Out of scope','Contracts','What is explicitly not part of the project.','The most effective protection against scope creep — in the SOW, as detailed as the scope itself.'],
['Patent','IP','An industrial property right for technical inventions, up to 20 years.','Novelty is a precondition: pitching publicly first destroys patentability.'],
['Pivot','Method','A fundamental change of product, audience or business model based on what you learned.','Not a failure but the result of validation working.'],
['Post-money','Capital','Company value after the new capital is paid in.','Pre-money plus the investment. Confusing the two negotiates away percentage points.'],
['Pre-money','Capital','Company value before the investment.','Always clarify explicitly which of the two the term sheet means.'],
['Pre-seed','Capital','The first small financing stage, often before measurable revenue.','Typically grants, angels, convertibles. Team and problem are the focus.'],
['Product-market fit','Method','The state in which the market visibly pulls the product.','Retention is the most reliable signal. Scaling before it burns money.'],
['Pro rata','Term sheet','An investor\'s right to invest proportionally in later rounds.','Market standard. Only becomes impractical with very many small investors.'],
['Reverse charge','International','For B2B services within the EU the customer owes the VAT.','Check both VAT IDs and state them on the invoice, or you are liable for the tax.'],
['Retention','Metrics','The share of users still active after a given period.','The most important early-stage curve: only what stays can grow.'],
['Runway','Metrics','Time to insolvency: cash ÷ burn rate.','Below twelve months you negotiate from weakness — fundraising itself takes 3–6 months.'],
['SAFE','Capital','Simple agreement for future equity — a US instrument converting into shares later.','Uncommon in Germany; here it is almost always a convertible loan. The terms get mixed up often.'],
['Bogus self-employment','People','A formally self-employed person effectively working as an employee.','Back payment of social security hits the company retroactively. Use the status determination procedure.'],
['Scope creep','Contracts','Uncontrolled expansion of the project scope.','Without a change request process you keep working unpaid. Write it into the SOW.'],
['Seed','Capital','The financing stage after pre-seed, with first traction in place.','From roughly 500 k€, usually with a lead VC and formal due diligence.'],
['Severability','Contracts','A clause ensuring invalid provisions do not void the whole contract.','A standard clause nobody reads that saves the contract in a dispute.'],
['SLA','Contracts','A service level agreement on measurable service quality, with compensation.','An SLA without service credits is marketing. Typical: 99.9 % uptime, 1 h response for critical issues.'],
['SOW','Contracts','Statement of work — the concrete project description under an MSA.','Scope, deliverables, acceptance criteria, pricing, change request process.'],
['Share capital','Legal','The equity shareholders contribute when incorporating a corporation.','GmbH 25,000 € (at least 12,500 € paid in), UG from 1 € — in practice more.'],
['Status determination','People','A German pension insurance procedure clarifying whether someone is genuinely self-employed.','The cheap way to rule out bogus self-employment before an audit finds it.'],
['TAM / SAM / SOM','Method','Total, serviceable and obtainable market.','Calculate bottom-up: number of customers × annual revenue. Study figures convince nobody.'],
['Tag along','Term sheet','The minority\'s right to sell on the same terms in a majority sale.','Protection for small shareholders — the counterpart to drag along.'],
['Term sheet','Term sheet','A non-binding summary of the terms of an investment.','It shapes the later investment agreement almost entirely. Never sign without a law firm.'],
['Technical & organisational measures','Privacy','Measures protecting personal data.','Encryption, access control, backups — documented, because enterprise clients ask.'],
['Traction','Metrics','Measurable progress: usage, revenue, repeat use, pilot customers.','The strongest evidence in a pitch. The curve over weeks matters more than the absolute number.'],
['Trade secret','IP','A business secret as an alternative to a patent.','Only protected if you can show you took reasonable measures to keep it secret.'],
['Unit economics','Metrics','Contribution margin per unit or customer — does a single customer make money?','Tells you whether growth solves your problem or magnifies it.'],
['VAT ID','Tax','A VAT identification number for intra-EU transactions.','On application from the tax office. Without it there is no clean EU B2B business.'],
['Vanity metric','Metrics','A number that looks good and says nothing about the state of the business.','Sign-ups, downloads, followers. They always go up, even when nothing works.'],
['Venture debt','Capital','Debt for startups, usually after a VC round, with interest and warrants.','Barely dilutive but expensive and tied to covenants. No substitute for equity.'],
['Dilution','Capital','The drop in your percentage when new shares are issued.','Normal as long as the pie grows. Only a problem if you give away too much too early.'],
['Vesting','Legal','Shares earned over time, usually four years with a one-year cliff.','Without vesting you are effectively unfundable.'],
['Veto right','Term sheet','An investor\'s consent requirement for certain resolutions.','Normal for fundamental matters. On day-to-day decisions it is a red flag.'],
['Input VAT','Tax','VAT you have paid yourself and offset against the VAT you collect.','Choosing the small-business rule waives it — expensive if you invest heavily.'],
['VSOP','People','Virtual employee participation, purely contractual, paid out on exit.','The German standard, because no notary is needed and tax only arises on payout.'],
['Records of processing','Privacy','An internal register of all personal data processing activities.','Mandatory even for small teams. The first document a supervisory authority requests.'],
['Convertible loan agreement','Capital','A loan converting into shares in the next round on agreed terms.','Fast and without an immediate valuation. Cap and discount are the numbers that matter.'],
['Warranty','Contracts','An assurance of certain characteristics.','Limit it in time (30–90 days). "Bug-free forever" cannot be delivered.'],
['Working student','People','Student employment with a social security privilege.','Max. 20 h/week during term, then only pension contributions. Keep proof of enrolment.']
];

var LANG = 'de';
try { if (localStorage.getItem('launch.lang') === 'en') LANG = 'en'; } catch (e) {}

var DE_NAV = NAV, DE_STAGES = STAGES, DE_AREAS = AREAS, DE_ARTICLES = ARTICLES,
    DE_TERMS = TERMS, DE_FUNDING = FUNDING;
var UI = UI_DE;

function applyLang() {
  if (LANG === 'en') {
    UI = UI_EN;
    NAV = DE_NAV.map(function (n, i) { return { id:n.id, icon:n.icon, label:EN.nav[i][0], mini:EN.nav[i][1] }; });
    STAGES = DE_STAGES.map(function (s, i) {
      var e = EN.stages[i];
      return { ix:s.ix, part:s.part, partLabel:e.part, t:e.t, s:e.s,
        steps: s.steps.map(function (x, j) { return { id:x.id, go:x.go, t:e.steps[j][0], p:e.steps[j][1] }; }) };
    });
    AREAS = DE_AREAS.map(function (a, i) { return { t:EN.areas[i][0], tele:EN.areas[i][1], ids:a.ids }; });
    ARTICLES = DE_ARTICLES.map(function (a) {
      var e = EN.arts[a.id];
      return { id:a.id, t:e ? e[0] : a.t, sub:e ? e[1] : a.sub, html:a.html };
    });
    TERMS = DE_TERMS.map(function (t, i) {
      var e = EN.terms && EN.terms[i];
      return e ? [e[0], e[1], e[2], e[3], t[0]] : [t[0], t[1], t[2], t[3], t[0]];
    });
    FUNDING = DE_FUNDING.map(function (f, i) {
      return { n:f.n, art:EN.art[f.art] || f.art, ph:f.ph, free:f.free,
        lvl:EN.lvl[f.lvl] || f.lvl, fok:f.fok.map(function (x) { return EN.fok[x] || x; }),
        dead:f.dead, w:f.w, add:f.add, out:f.out, d:EN.funding[i] || f.d };
    });
  } else {
    UI = UI_DE;
    NAV = DE_NAV; STAGES = DE_STAGES; AREAS = DE_AREAS; ARTICLES = DE_ARTICLES; FUNDING = DE_FUNDING;
    TERMS = DE_TERMS.map(function (t) { return [t[0], t[1], t[2], t[3], t[0]]; });
  }
  document.documentElement.lang = LANG;
}

<script>
/* ==========================================================================
   APP
   ========================================================================== */
(function () {
  'use strict';

  var main = document.getElementById('main');
  var KEY  = 'launch.build.v1';
  var view = 'mission';
  var openStage = {};

  function fill(x) {
    return String(x).replace('%N%', TOTAL).replace('%T%', TERMS.length).replace('%A%', AREAS.length);
  }

  /* Sprachwechsel: schreibt nur 'launch.lang'. Der Fortschritt liegt unter
     'launch.build.v1' und ist an Schritt-IDs gebunden — er bleibt unberührt. */
  function paintChrome() {
    document.getElementById('brandSub').textContent = UI.brandSub;
    document.getElementById('findLbl').textContent = UI.search;
    document.getElementById('find2').setAttribute('aria-label', UI.search);
    document.getElementById('sideNote1').textContent = UI.sideNote1;
    document.getElementById('sideNote2').textContent = UI.sideNote2;
    document.getElementById('askBtnLbl').textContent = UI.askBtn;
    document.getElementById('askTitle').textContent = UI.askTitle;
    document.getElementById('askSend').textContent = UI.askSend;
    document.getElementById('askIn').placeholder = UI.askPlaceholder;
    document.getElementById('q').placeholder = UI.sPlaceholder;
    document.getElementById('xSearch').textContent = UI.doneBtn;
    document.getElementById('xAsk').textContent = UI.doneBtn;
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.lang === LANG ? 'true' : 'false');
    });
  }

  function setLang(l) {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem('launch.lang', l); } catch (e) {}
    applyLang();
    buildIdx();
    lq = ''; ll = ''; lc = ''; fq = ''; fPh = ''; fLv = '';
    chat.innerHTML = '';
    rebuildNav();
    paintChrome();
    go(view);
  }
  window.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-lang]') : null;
    if (b) setLang(b.dataset.lang);
  });

  /* --- App-Icon in Tab und Homescreen --- */
  (function () {
    var src = document.querySelector('.brand img').getAttribute('src');
    ['icon', 'apple-touch-icon', 'shortcut icon'].forEach(function (r) {
      var l = document.createElement('link'); l.rel = r; l.href = src; document.head.appendChild(l);
    });
    [['theme-color', '#000324'], ['apple-mobile-web-app-title', 'LAUNCH'],
     ['apple-mobile-web-app-capable', 'yes'], ['mobile-web-app-capable', 'yes']].forEach(function (m) {
      var e = document.createElement('meta'); e.name = m[0]; e.content = m[1]; document.head.appendChild(e);
    });
  })();

  /* --- Fortschritt --- */
  function load() { try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
  var done = load();

  var TOTAL = STAGES.reduce(function (n, s) { return n + s.steps.length; }, 0);
  function nDone() { return STAGES.reduce(function (n, s) { return n + s.steps.filter(function (x) { return done[x.id]; }).length; }, 0); }
  function stageDone(s) { return s.steps.every(function (x) { return done[x.id]; }); }
  function built() {
    var m = {};
    STAGES.forEach(function (s) { m[s.part] = stageDone(s); });
    return m;
  }
  function pct() { return TOTAL ? Math.round(nDone() / TOTAL * 100) : 0; }

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="m5 13 4.5 4.5L19 7"></path></svg>';
  var CHEV  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="m9 6 6 6-6 6"></path></svg>';
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"></path></svg>';
  var SEARCH= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>';

  function art(id) { for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) return ARTICLES[i]; return null; }
  function areaOf(id) { for (var i = 0; i < AREAS.length; i++) if (AREAS[i].ids.indexOf(id) >= 0) return AREAS[i]; return null; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  /* ======================= RAKETE ======================= */
  var RK = {
    nose:  'M110 16 C124 44 136 76 138 104 L82 104 C84 76 96 44 110 16 Z',
    hull:  'M82 104 L138 104 L138 274 L82 274 Z',
    band1: 'M82 138 L138 138 L138 150 L82 150 Z',
    band2: 'M82 194 L138 194 L138 206 L82 206 Z',
    engine:'M86 274 L134 274 L149 330 L71 330 Z',
    finL:  'M82 232 L82 284 L44 314 L54 246 Z',
    finR:  'M138 232 L138 284 L176 314 L166 246 Z',
    flame: 'M110 399 C90 370 80 348 87 328 L133 328 C140 348 130 370 110 399 Z'
  };

  function rocketSVG() {
    var b = built();
    function k(p, style) { return b[p] ? 'part part--done ' + style : 'part part--todo'; }
    var lit = pct() === 100;
    return '<svg class="rocket' + (lit ? ' lit' : '') + '" viewBox="0 0 220 400" role="img" aria-label="' + UI.buildState + ': ' + pct() + '%">' +
      /* Startrampe */
      '<g class="' + k('pad', 'rig') + '">' +
        '<path d="M186 152 L186 348" />' +
        '<path d="M186 190 L142 190 M186 250 L142 250 M186 300 L152 300" />' +
        '<path d="M28 348 L192 348" />' +
        '<path d="M46 348 L60 366 M174 348 L160 366" />' +
        '<path d="M18 366 L202 366" />' +
        '<rect x="30" y="330" width="16" height="8" rx="2" />' +
        '<rect x="52" y="336" width="11" height="6" rx="2" />' +
        '<circle cx="200" cy="330" r="5" />' +
      '</g>' +
      /* Flamme */
      '<g class="flame" style="transform-origin:110px 328px"><path d="' + RK.flame + '" fill="var(--sig)" opacity=".72"/>' +
        '<path d="M110 376 C100 358 96 342 100 328 L120 328 C124 342 120 358 110 376 Z" fill="var(--sig-2)"/></g>' +
      /* Triebwerk */
      '<g class="' + k('engine', 'skin') + '"><path d="' + RK.engine + '" />' +
        '<path d="M96 292 L96 330 M110 292 L110 330 M124 292 L124 330" ' + (b.engine ? 'stroke="var(--sig-2)" stroke-width="1" fill="none"' : '') + ' /></g>' +
      /* Flossen */
      '<g class="' + k('fins', 'skin') + '"><path d="' + RK.finL + '" /><path d="' + RK.finR + '" /></g>' +
      /* Rumpf */
      '<g class="' + k('hull', 'skin') + '"><path d="' + RK.hull + '" /></g>' +
      /* Tanks */
      '<g class="' + k('tanks', 'accent') + '"><path d="' + RK.band1 + '" /><path d="' + RK.band2 + '" /></g>' +
      /* Steuerung */
      '<g class="' + k('fins', 'glass') + '"><circle cx="110" cy="172" r="8" /></g>' +
      /* Nutzlast */
      '<g class="' + k('nose', 'skin') + '"><path d="' + RK.nose + '" /></g>' +
      '<g class="' + k('nose', 'glass') + '"><circle cx="110" cy="82" r="9" /></g>' +
    '</svg>';
  }

  var gid = 0;
  var GPATH = 'M20 3 C28 15 34 29 34 45 L34 57 L27 57 L27 65 L13 65 L13 57 L6 57 L6 45 C6 29 12 15 20 3 Z';
  function gaugeSVG(w, h) {
    var id = 'lg' + (++gid), p = pct();
    return '<svg viewBox="0 0 40 72" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<defs><clipPath id="' + id + '"><path d="' + GPATH + '"/></clipPath></defs>' +
      '<path d="' + GPATH + '" fill="var(--surf-3)" stroke="var(--hair)" stroke-width="1.5"/>' +
      '<rect x="0" y="' + ((100 - p) * 0.72) + '" width="40" height="72" fill="var(--sig)" clip-path="url(#' + id + ')"/>' +
      '<path d="' + GPATH + '" fill="none" stroke="var(--steel)" stroke-width="1.5"/>' +
    '</svg>';
  }

  function paintGauges() {
    document.getElementById('gaugeSide').innerHTML =
      gaugeSVG(26, 46) + '<span class="gauge__t"><b>' + pct() + UI.gAssembled + '</b><span>' + UI.gSteps(nDone(), TOTAL) + '</span></span>';
    document.getElementById('gaugeTop').innerHTML = gaugeSVG(16, 28) + '<span>' + pct() + ' %</span>';
  }

  /* ======================= NAV ======================= */
  function rebuildNav() {
    var nav = document.getElementById('nav'), tabs = document.getElementById('tabs');
    nav.innerHTML = ''; tabs.innerHTML = '';
    NAV.forEach(function (n) {
      var a = document.createElement('button');
      a.type = 'button'; a.dataset.nav = n.id;
      a.innerHTML = '<i>' + n.icon + '</i>' + n.label;
      a.addEventListener('click', function () { go(n.id); });
      nav.appendChild(a);
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.nav = n.id;
      b.innerHTML = '<i>' + n.icon + '</i><span>' + n.mini + '</span>';
      b.addEventListener('click', function () { go(n.id); });
      tabs.appendChild(b);
    });
    mark(view);
  }

  function mark(id) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
      b.setAttribute('aria-current', b.dataset.nav === id ? 'true' : 'false');
    });
  }

  function go(v, sub) {
    view = v; mark(v); window.scrollTo(0, 0);
    if (v === 'mission') mission();
    else if (v === 'aufbau') aufbau();
    else if (v === 'wissen') sub ? reader(sub) : wissen();
    else if (v === 'lexikon') lexikon(sub);
    else if (v === 'foerder') foerder();
  }

  function wire() {
    Array.prototype.forEach.call(main.querySelectorAll('[data-v]'), function (b) {
      b.addEventListener('click', function () { go(b.dataset.v); });
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-a]'), function (b) {
      b.addEventListener('click', function () { go('wissen', b.dataset.a); });
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-t]'), function (b) {
      b.addEventListener('click', function () { go('lexikon', b.dataset.t); });
    });
  }

  function foot() {
    return '<footer class="foot"><p>' + UI.footNote1 + '</p><p>' + UI.footNote2 + '</p></footer>';
  }

  function goPills(list) {
    return (list || []).map(function (g) {
      if (g[0] === 'a') { var a = art(g[1]); return a ? '<button class="pill" type="button" data-a="' + g[1] + '">' + a.t + '</button>' : ''; }
      if (g[0] === 't') return '<button class="pill" type="button" data-t="' + esc(g[1]) + '">' + g[1] + '</button>';
      if (g[0] === 'v') { var n = NAV.filter(function (x) { return x.id === g[1]; })[0]; return '<button class="pill" type="button" data-v="' + g[1] + '">' + (n ? n.label : g[1]) + '</button>'; }
      return '';
    }).join('');
  }

  /* ======================= MISSION ======================= */
  function mission() {
    var next = null, nextS = null;
    for (var i = 0; i < STAGES.length && !next; i++)
      for (var j = 0; j < STAGES[i].steps.length; j++)
        if (!done[STAGES[i].steps[j].id]) { next = STAGES[i].steps[j]; nextS = STAGES[i]; break; }

    var chips = STAGES.map(function (s) {
      var f = stageDone(s), partial = s.steps.some(function (x) { return done[x.id]; });
      return '<span class="chip' + (f ? ' chip--go' : (partial ? ' chip--part' : '')) + '">' + (f ? '<i>&#10003;</i>' : '') + s.partLabel + '</span>';
    }).join('');

    main.innerHTML = '<div class="wrap">' +
      '<section class="bay"><div class="bay__grid"></div><div class="bay__in">' +
        rocketSVG() +
        '<div class="readout">' +
          '<p class="tele" style="margin:0">' + UI.buildState + '</p>' +
          '<div class="readout__hd"><b>' + (pct() === 100 ? UI.ready : UI.assembling) + '</b><span>' + pct() + ' %</span></div>' +
          '<div class="bar"><i style="width:' + pct() + '%"></i></div>' +
          '<p>' + (pct() === 0 ? UI.pct0 : (pct() === 100 ? UI.pct100 : UI.pctMid)) + '</p>' +
        '</div>' +
      '</div><div class="bay__chips"><div class="chips">' + chips + '</div></div></section>' +

      (next ? '<button class="card" type="button" data-v="aufbau" style="margin-bottom:20px">' +
        '<em>' + UI.next + ' · ' + nextS.partLabel + '</em><b>' + next.t + '</b><p>' + next.p + '</p></button>'
        : '<div class="card" style="margin-bottom:20px;cursor:default"><em>' + UI.allDoneE + '</em><b>' + UI.allDoneT + '</b><p>' + UI.allDoneP + '</p></div>') +

      '<div class="stat3">' +
        '<div><b>' + ARTICLES.length + '</b><span>' + UI.statArticles + '</span></div>' +
        '<div><b>' + TERMS.length + '</b><span>' + UI.statTerms + '</span></div>' +
        '<div><b>' + FUNDING.length + '</b><span>' + UI.statFunding + '</span></div>' +
      '</div>' +

      '<h2 style="margin-top:6px">' + UI.whereTo + '</h2>' +
      '<div class="cards">' + [['v','aufbau',0],['v','lexikon',1],['v','foerder',2],
        ['a','rechtsformen',3],['a','buchhaltung',4],['v','wissen',5]].map(function (x) {
          var u = UI.tiles[x[2]];
          return '<button class="card" type="button" data-' + x[0] + '="' + x[1] + '"><em>' +
            fill(u[0]) + '</em><b>' + u[1] + '</b><p>' + fill(u[2]) + '</p></button>';
        }).join('') + '</div>' +

      '<h2>' + UI.sixGroups + '</h2>' +
      '<div class="list">' + STAGES.map(function (s) {
        var d = s.steps.filter(function (x) { return done[x.id]; }).length;
        return '<button class="item" type="button" data-v="aufbau">' +
          '<span class="stage__ix"' + (stageDone(s) ? ' style="background:var(--ok-dim);border-color:var(--ok);color:var(--ok)"' : '') + '>' + s.ix + '</span>' +
          '<div><b>' + s.t + '</b><span>' + s.partLabel + ' · ' + s.s + '</span></div>' +
          '<span class="stage__n">' + d + '/' + s.steps.length + '</span>' + ARROW + '</button>';
      }).join('') + '</div>' +
      foot() + '</div>';
    wire(); paintGauges();
  }

  /* ======================= AUFBAU ======================= */
  function aufbau() {
    var h = '<div class="wrap"><p class="tele">' + UI.aTele + '</p><h1>' + UI.aH1 + '</h1>' +
      '<p class="lead">' + UI.aLead + '</p>' +
      '<div class="bay" style="padding:16px 18px"><div class="bay__grid"></div><div class="readout" style="position:relative">' +
        '<div class="readout__hd"><b>' + UI.aAssembly + '</b><span>' + nDone() + ' / ' + TOTAL + '</span></div>' +
        '<div class="bar"><i style="width:' + pct() + '%"></i></div></div></div>';

    STAGES.forEach(function (s) {
      var d = s.steps.filter(function (x) { return done[x.id]; }).length, full = d === s.steps.length;
      var op = openStage[s.ix] !== undefined ? openStage[s.ix] : !full;
      h += '<section class="stage' + (full ? ' stage--full' : '') + '" data-st="' + s.ix + '" data-open="' + op + '">' +
        '<button class="stage__hd" type="button" data-tog="' + s.ix + '">' +
          '<span class="stage__ix">' + s.ix + '</span>' +
          '<span class="stage__t"><b>' + s.t + '</b><span>' + s.s + '</span></span>' +
          '<span class="stage__n">' + d + '/' + s.steps.length + '</span>' +
          '<span class="stage__c">' + CHEV + '</span></button>' +
        '<div class="stage__bd"><p class="stage__part">' + UI.aGroup + s.partLabel + '</p>' +
          s.steps.map(function (x) {
            var g = goPills(x.go);
            return '<div class="step">' +
              '<button class="box" type="button" role="checkbox" aria-checked="' + (done[x.id] ? 'true' : 'false') + '" aria-label="' + esc(x.t) + '" data-step="' + x.id + '">' + CHECK + '</button>' +
              '<div class="step__b"><b>' + x.t + '</b><p>' + x.p + '</p>' + (g ? '<div class="step__go">' + g + '</div>' : '') + '</div></div>';
          }).join('') +
        '</div></section>';
    });

    main.innerHTML = h + foot() + '</div>';

    Array.prototype.forEach.call(main.querySelectorAll('[data-tog]'), function (b) {
      b.addEventListener('click', function () {
        var s = main.querySelector('[data-st="' + b.dataset.tog + '"]');
        var n = s.getAttribute('data-open') !== 'true';
        s.setAttribute('data-open', n); openStage[b.dataset.tog] = n;
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-step]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.step;
        if (done[id]) delete done[id]; else done[id] = 1;
        save();
        var y = window.scrollY; aufbau(); window.scrollTo(0, y);
      });
    });
    wire(); paintGauges();
  }

  /* ======================= WISSEN ======================= */
  function wissen() {
    var h = '<div class="wrap"><p class="tele">' + UI.wTele + '</p><h1>' + UI.wH1 + '</h1>' +
      '<p class="lead">' + UI.wLead(ARTICLES.length, AREAS.length) + '</p>';
    AREAS.forEach(function (ar) {
      h += '<section style="margin-bottom:32px"><h2 style="margin-top:0;display:flex;align-items:baseline;gap:10px">' + ar.t +
        ' <em style="font-style:normal;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600">' + ar.tele + '</em></h2><div class="list">' +
        ar.ids.map(function (id) {
          var a = art(id);
          return a ? '<button class="item" type="button" data-a="' + id + '"><div><b>' + a.t + '</b><span>' + a.sub + '</span></div>' + ARROW + '</button>' : '';
        }).join('') + '</div></section>';
    });
    main.innerHTML = h + foot() + '</div>';
    wire(); paintGauges();
  }

  function reader(id) {
    var a = art(id); if (!a) { wissen(); return; }
    var ar = areaOf(id);
    var sibs = ar ? ar.ids.filter(function (x) { return x !== id; }) : [];
    main.innerHTML = '<div class="wrap">' +
      '<button class="back" type="button" id="bk">← ' + (ar ? ar.t : UI.wTele) + '</button>' +
      '<article class="doc"><p class="tele">' + (ar ? ar.tele : '') + '</p><h1>' + a.t + '</h1><p class="lead">' + a.sub + '</p>' +
        (UI.bodyNote ? '<div class="hint">' + UI.bodyNote + '</div>' : '') + a.html + '</article>' +
      (sibs.length ? '<h2>' + UI.wMore + ar.t + '</h2><div class="list">' + sibs.map(function (x) {
        var s = art(x);
        return s ? '<button class="item" type="button" data-a="' + x + '"><div><b>' + s.t + '</b><span>' + s.sub + '</span></div>' + ARROW + '</button>' : '';
      }).join('') + '</div>' : '') +
      foot() + '</div>';
    document.getElementById('bk').addEventListener('click', function () { go('wissen'); });
    wire(); mark('wissen'); paintGauges();
  }

  /* ======================= LEXIKON ======================= */
  var lq = '', ll = '', lc = '';
  function lexikon(open) {
    var cats = []; TERMS.forEach(function (t) { if (cats.indexOf(t[1]) < 0) cats.push(t[1]); }); cats.sort();
    if (open) { lq = ''; ll = ''; lc = ''; }
    var L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    main.innerHTML = '<div class="wrap"><p class="tele">' + UI.lTele + '</p><h1>' + UI.lH1(TERMS.length) + '</h1>' +
      '<p class="lead">' + UI.lLead + '</p>' +
      '<div class="field">' + SEARCH + '<input id="lq" type="search" placeholder="' + UI.lPlaceholder + '" value="' + esc(lq) + '" autocomplete="off" aria-label="' + UI.lPlaceholder + '"></div>' +
      '<div class="az" id="az"><button type="button" data-l="" class="' + (ll ? '' : 'on') + '">' + UI.lAll + '</button>' +
        L.map(function (x) {
          var has = TERMS.some(function (t) { return t[0].toUpperCase().indexOf(x) === 0; });
          return '<button type="button" data-l="' + x + '"' + (has ? '' : ' disabled') + (ll === x ? ' class="on"' : '') + '>' + x + '</button>';
        }).join('') + '</div>' +
      '<div class="filters" id="lcats"><button class="chip' + (lc ? '' : ' chip--on') + '" type="button" data-c="">' + UI.lAllAreas + '</button>' +
        cats.map(function (c) { return '<button class="chip' + (lc === c ? ' chip--on' : '') + '" type="button" data-c="' + esc(c) + '">' + c + '</button>'; }).join('') + '</div>' +
      '<div class="list" id="terms"></div>' + foot() + '</div>';

    var box = document.getElementById('terms');
    function paint() {
      var q = lq.trim().toLowerCase();
      var rows = TERMS.filter(function (t) {
        if (ll && t[0].toUpperCase().indexOf(ll) !== 0) return false;
        if (lc && t[1] !== lc) return false;
        if (q && (t[0] + ' ' + t[2] + ' ' + t[3]).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      if (!rows.length) { box.innerHTML = '<p class="none">' + UI.lNone + '</p>'; return; }
      box.innerHTML = rows.map(function (t) {
        var o = open && (open === t[0] || open === t[4]);
        return '<div class="term" data-open="' + (o ? 'true' : 'false') + '">' +
          '<button class="term__hd" type="button"><b>' + t[0] + '</b><i>' + t[1] + '</i></button>' +
          '<div class="term__bd"><p>' + t[2] + '</p><p class="why"><b>' + UI.lWhy + '</b>' + t[3] + '</p></div></div>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('.term__hd'), function (b) {
        b.addEventListener('click', function () {
          var t = b.parentNode;
          t.setAttribute('data-open', t.getAttribute('data-open') === 'true' ? 'false' : 'true');
        });
      });
      if (open) { var tg = box.querySelector('[data-open="true"]'); if (tg) tg.scrollIntoView({ block: 'center' }); }
    }
    paint();
    document.getElementById('lq').addEventListener('input', function (e) { lq = e.target.value; open = null; paint(); });
    Array.prototype.forEach.call(document.querySelectorAll('#az button'), function (b) {
      b.addEventListener('click', function () { ll = b.dataset.l; lexikon(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#lcats button'), function (b) {
      b.addEventListener('click', function () { lc = b.dataset.c; lexikon(); });
    });
    mark('lexikon'); paintGauges();
  }

  /* ======================= FÖRDERUNG ======================= */
  var fPh = '', fLv = '', fFree = 0, fq = '';
  function foerder() {
    var phases = ['Ideation', 'Pre-Seed', 'Seed', 'Growth', 'Scale-Up'];
    var lvls = []; FUNDING.forEach(function (f) { if (lvls.indexOf(f.lvl) < 0) lvls.push(f.lvl); });
    lvls.sort(function (a, b) {
      var o = ['Bund', 'EU', 'Hessen', 'Rheinland-Pfalz'];
      var ia = o.indexOf(a), ib = o.indexOf(b);
      if (ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      return a.localeCompare(b);
    });

    main.innerHTML = '<div class="wrap"><p class="tele">' + UI.fTele + '</p><h1>' + UI.fH1 + '</h1>' +
      '<p class="lead">' + UI.fLead + '</p>' +
      '<div class="field">' + SEARCH + '<input id="fq" type="search" placeholder="' + UI.fPlaceholder + '" value="' + esc(fq) + '" autocomplete="off" aria-label="' + UI.fPlaceholder + '"></div>' +
      '<div class="filters" id="fPh"><button class="chip' + (fPh ? '' : ' chip--on') + '" type="button" data-p="">' + UI.fAllPhases + '</button>' +
        phases.map(function (p) { return '<button class="chip' + (fPh === p ? ' chip--on' : '') + '" type="button" data-p="' + p + '">' + p + '</button>'; }).join('') + '</div>' +
      '<div class="filters" id="fLv"><button class="chip' + (fLv ? '' : ' chip--on') + '" type="button" data-l="">' + UI.fAllLevels + '</button>' +
        lvls.map(function (l) { return '<button class="chip' + (fLv === l ? ' chip--on' : '') + '" type="button" data-l="' + esc(l) + '">' + l + '</button>'; }).join('') + '</div>' +
      '<div class="filters"><button class="chip' + (fFree ? ' chip--on' : '') + '" type="button" id="fFree">' + UI.fOnlyFree + '</button></div>' +
      '<div class="list" id="funds"></div>' +
      '<div class="hint" style="margin-top:18px">' + UI.fSource + '</div>' +
      foot() + '</div>';

    var box = document.getElementById('funds');
    function paint() {
      var q = fq.trim().toLowerCase();
      var rows = FUNDING.filter(function (f) {
        if (fPh && f.ph.indexOf(fPh) < 0) return false;
        if (fLv && f.lvl !== fLv) return false;
        if (fFree && f.free !== 1) return false;
        if (q && (f.n + ' ' + f.d + ' ' + f.lvl + ' ' + f.art + ' ' + f.fok.join(' ')).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      if (!rows.length) { box.innerHTML = '<p class="none">' + UI.fNone + '</p>'; return; }
      box.innerHTML = rows.map(function (f) {
        return '<div class="fund"><div class="fund__hd"><b>' + f.n + '</b>' +
            (f.out ? '<span class="tag tag--dead">' + UI.tagOut + '</span>' : (f.free === 1 ? '<span class="tag tag--free">' + UI.tagFree + '</span>' : (f.free === 2 ? '<span class="tag">' + UI.tagPartly + '</span>' : ''))) +
          '</div>' +
          '<div class="fund__tags"><span class="tag tag--art">' + f.art + '</span><span class="tag">' + f.lvl + '</span>' +
            f.ph.map(function (p) { return '<span class="tag">' + p + '</span>'; }).join('') +
            (f.add ? '<span class="tag">' + UI.tagAdded + '</span>' : '') + '</div>' +
          '<p>' + f.d + '</p>' +
          '<div class="fund__meta">' +
            '<span>' + UI.fFocus + '<b>' + f.fok.join(', ') + '</b></span>' +
            (f.dead ? '<span>' + UI.fDeadline + '<b>' + f.dead + '</b></span>' : '') +
            (f.w ? '<span><a href="https://' + f.w + '" target="_blank" rel="noopener">' + f.w + ' →</a></span>' : '') +
          '</div></div>';
      }).join('');
    }
    paint();
    document.getElementById('fq').addEventListener('input', function (e) { fq = e.target.value; paint(); });
    Array.prototype.forEach.call(document.querySelectorAll('#fPh button'), function (b) {
      b.addEventListener('click', function () { fPh = b.dataset.p; foerder(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#fLv button'), function (b) {
      b.addEventListener('click', function () { fLv = b.dataset.l; foerder(); });
    });
    document.getElementById('fFree').addEventListener('click', function () { fFree = fFree ? 0 : 1; foerder(); });
    mark('foerder'); paintGauges();
  }

  /* ======================= SUCHE ======================= */
  var IDX = [];
  function buildIdx() {
    IDX = [];
    ARTICLES.forEach(function (a) {
      var ar = areaOf(a.id);
      IDX.push({ k: UI.kArticle + (ar ? ar.t : ''), t: a.t, s: a.sub,
        hay: (a.t + ' ' + a.sub + ' ' + a.html.replace(/<[^>]+>/g, ' ')).toLowerCase(),
        run: function () { go('wissen', a.id); } });
    });
    TERMS.forEach(function (t) {
      IDX.push({ k: UI.kLex + t[1], t: t[0], s: t[2],
        hay: (t[0] + ' ' + t[2] + ' ' + t[3] + ' ' + t[4]).toLowerCase(),
        run: function () { go('lexikon', t[4]); } });
    });
    STAGES.forEach(function (s) {
      s.steps.forEach(function (x) {
        IDX.push({ k: UI.kStep + s.partLabel, t: x.t, s: x.p,
          hay: (x.t + ' ' + x.p).toLowerCase(),
          run: function () { openStage[s.ix] = true; go('aufbau'); } });
      });
    });
    FUNDING.forEach(function (f) {
      IDX.push({ k: UI.kFund + f.lvl, t: f.n, s: f.d,
        hay: (f.n + ' ' + f.d + ' ' + f.lvl + ' ' + f.art + ' ' + f.fok.join(' ')).toLowerCase(),
        run: function () { fq = f.n.slice(0, 18); go('foerder'); } });
    });
  }

  var sOvl = document.getElementById('searchOvl'), qEl = document.getElementById('q'), hits = document.getElementById('hits');
  function openS() { sOvl.hidden = false; qEl.value = ''; paintHits(''); setTimeout(function () { qEl.focus(); }, 30); }
  function closeS() { sOvl.hidden = true; }
  function paintHits(q) {
    q = q.trim().toLowerCase();
    if (!q) { hits.innerHTML = '<p class="none">' + UI.sHint + '</p>'; return; }
    var r = IDX.filter(function (x) { return x.hay.indexOf(q) >= 0; }).sort(function (a, b) {
      var ai = a.t.toLowerCase().indexOf(q), bi = b.t.toLowerCase().indexOf(q);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    }).slice(0, 40);
    if (!r.length) { hits.innerHTML = '<p class="none">' + UI.sNone + '</p>'; return; }
    hits.innerHTML = '<div class="list">' + r.map(function (x, i) {
      return '<button class="hit" type="button" data-i="' + i + '"><em>' + x.k + '</em><b>' + x.t + '</b><span>' +
        (x.s.length > 130 ? x.s.slice(0, 130) + '…' : x.s) + '</span></button>';
    }).join('') + '</div>';
    Array.prototype.forEach.call(hits.querySelectorAll('.hit'), function (b) {
      b.addEventListener('click', function () { closeS(); r[+b.dataset.i].run(); });
    });
  }
  document.getElementById('find1').addEventListener('click', openS);
  document.getElementById('find2').addEventListener('click', openS);
  document.getElementById('xSearch').addEventListener('click', closeS);
  qEl.addEventListener('input', function (e) { paintHits(e.target.value); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeS(); closeA(); return; }
    var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key === 'k'))) { e.preventDefault(); openS(); }
  });

  /* ======================= FRAG LAUNCH ======================= */
  var aOvl = document.getElementById('askOvl'), chat = document.getElementById('chat');
  var aForm = document.getElementById('askForm'), aIn = document.getElementById('askIn'), aSend = document.getElementById('askSend');
  var sampleFn = null, ready = false, busy = false;

  var DIGEST = (function () {
    var s = 'BAUPLAN (6 Baugruppen der Rakete):\n';
    STAGES.forEach(function (st) {
      s += st.ix + ' ' + st.t + ' [' + st.partLabel + ']: ' + st.steps.map(function (x) { return x.t; }).join('; ') + '\n';
    });
    s += '\nARTIKEL:\n';
    AREAS.forEach(function (ar) {
      ar.ids.forEach(function (id) { var a = art(id); if (a) s += '- [' + ar.t + '] ' + a.t + ': ' + a.sub + '\n'; });
    });
    s += '\nLEXIKON:\n';
    TERMS.forEach(function (t) { s += t[0] + ' (' + t[1] + '): ' + t[2] + '\n'; });
    s += '\nFOERDER-KOMPASS:\n';
    FUNDING.forEach(function (f) {
      s += f.n + ' | ' + f.art + ' | ' + f.lvl + ' | Phasen: ' + f.ph.join('/') +
        ' | equity-frei: ' + (f.free === 1 ? 'ja' : f.free === 2 ? 'teils' : 'nein') +
        (f.dead ? ' | Deadline ' + f.dead : '') + ' | ' + f.d + '\n';
    });
    return s;
  })();

  function RULES() { return 'Du bist der Assistent der App "LAUNCH", einer Wissensbasis fuer Gruenderinnen und Gruender in Deutschland.\n\n' +
    'Regeln:\n' +
    '- ' + UI.askLangRule + ' Direkt und ohne Floskeln. Maximal 180 Woerter, ausser es wird mehr verlangt.\n' +
    '- Nutze vorrangig das Material unten. Nenne am Ende in einer Zeile, wo in der App mehr dazu steht (Artikelname, Lexikonbegriff, Baugruppe oder Foerder-Kompass).\n' +
    '- Steht etwas nicht im Material, sag das offen und antworte mit allgemeinem Gruendungswissen, markiert als "nicht aus der App".\n' +
    '- Bei rechtlichen, steuerlichen, foerder- und finanzierungsbezogenen Fragen immer einen Satz anhaengen, dass das keine Rechts-, Steuer- oder Anlageberatung ist und sich Betraege und Fristen aendern.\n' +
    '- Erfinde nie Fristen, Betraege, Paragrafen, Programmnamen oder Links.\n' +
    '- Keine Aufzaehlung mit mehr als fuenf Punkten.\n\n' +
    'MATERIAL:\n' + DIGEST; }

  function ERRt(c) { return UI.err[c] || UI.err.upstream_error; }

  function bub(cls, txt) { var b = document.createElement('div'); b.className = 'msg ' + cls; b.textContent = txt; chat.appendChild(b); return b; }
  function greet() {
    chat.innerHTML = '';
    bub('msg--ai', UI.askGreet);
    var w = document.createElement('div'); w.className = 'sugg';
    UI.sugg.forEach(function (q) {
      var p = document.createElement('button'); p.className = 'pill'; p.type = 'button'; p.textContent = q;
      p.addEventListener('click', function () { ask(q); });
      w.appendChild(p);
    });
    chat.appendChild(w);
  }
  function openA() { aOvl.hidden = false; if (!chat.childNodes.length) greet(); setTimeout(function () { aIn.focus(); }, 30); }
  function closeA() { aOvl.hidden = true; }
  document.getElementById('askBtn').addEventListener('click', openA);
  document.getElementById('xAsk').addEventListener('click', closeA);

  function ask(q) {
    if (busy || !q.trim()) return;
    if (!ready) { bub('msg--sys', UI.askWait); return; }
    if (!sampleFn) { bub('msg--sys', UI.err.not_granted); return; }
    busy = true; aSend.disabled = true; aIn.value = '';
    var s = chat.querySelector('.sugg'); if (s) s.remove();
    bub('msg--me', q);
    var out = bub('msg--ai', UI.askThinking);
    var body = chat.parentNode; body.scrollTop = body.scrollHeight;

    sampleFn([{ role: 'user', content: RULES() }, { role: 'user', content: 'Frage / question: ' + q }], {
      onText: function (e) { out.textContent = e.text; body.scrollTop = body.scrollHeight; }
    }).then(function (r) { out.textContent = r.text; })
      .catch(function (e) {
        var m = ERRt(e && e.code);
        if (e && e.code === 'cancelled') out.remove();
        else if (e && e.text) out.textContent = e.text + '\n\n(' + m + ')';
        else out.textContent = m;
      })
      .then(function () { busy = false; aSend.disabled = false; body.scrollTop = body.scrollHeight; });
  }
  aForm.addEventListener('submit', function (e) { e.preventDefault(); ask(aIn.value); });

  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(function (fn) {
      sampleFn = fn; ready = true;
      if (!fn) document.getElementById('askBtn').style.display = 'none';
    }).catch(function () { ready = true; document.getElementById('askBtn').style.display = 'none'; });
  } else {
    ready = true; document.getElementById('askBtn').style.display = 'none';
  }

  /* ======================= START ======================= */
  applyLang();
  rebuildNav();
  paintChrome();
  buildIdx();
  go('mission');
})();
</script>
</body>
</html>
