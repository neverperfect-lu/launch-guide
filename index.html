A({ id:'problem', t:'Problem, Kunden & Validierung', sub:'Wie du erfährst, ob das Problem echt ist', html:
  '<p>Das häufigste Muster bei gescheiterten Startups: ein sauber gebautes Produkt, das niemand braucht. Interviews sind das billigste Gegenmittel — wenn man sie richtig führt.</p>'+
  '<h2>Die eine Regel</h2>'+
  '<p><strong>Frag nach der Vergangenheit, nicht nach der Zukunft.</strong> "Würdest du das nutzen?" produziert Höflichkeit. "Wann ist das Problem zuletzt aufgetreten und was hast du gemacht?" produziert Fakten.</p>'+
  '<h2>Fünf Fragen, die funktionieren</h2>'+
  '<ol><li>Erzähl mir vom letzten Mal, als du <em>X</em> gemacht hast.</li>'+
  '<li>Was war daran das Nervigste?</li>'+
  '<li>Wie löst du es heute — auch wenn die Lösung schlecht ist?</li>'+
  '<li>Was hast du schon versucht, was nicht funktioniert hat?</li>'+
  '<li>Was kostet dich das an Zeit oder Geld?</li></ol>'+
  '<h2>Signale, dass das Problem echt ist</h2>'+
  '<ul><li>Es gibt eine <strong>Behelfslösung</strong> — Excel, WhatsApp-Gruppe, Praktikant. Behelfslösungen sind der beste Beweis für Zahlungsbereitschaft.</li>'+
  '<li>Jemand hat dafür schon Geld ausgegeben.</li>'+
  '<li>Man kann benennen, <strong>wie oft</strong> es auftritt.</li>'+
  '<li>Dein Gegenüber wird emotional.</li></ul>'+
  '<div class="hint"><b>Zielgröße:</b> etwa 15 Interviews in einem Segment — danach wiederholen sich die Muster. 80&nbsp;% zuhören, die Lösung nicht pitchen, Zitate wörtlich notieren.</div>'+
  '<h2>Wettbewerb ehrlich auflisten</h2>'+
  '<p>Auch Excel, Papier und "machen wir gar nicht" sind Wettbewerber. <strong>"Wir haben keine Konkurrenz" heißt: Markt nicht verstanden.</strong> Die relevante Frage ist nicht, wer noch da ist, sondern was bei euch strukturell anders ist.</p>' });

A({ id:'mvp', t:'MVP & erste Nutzer', sub:'So klein wie möglich, so echt wie nötig', html:
  '<p>Ein MVP ist nicht die erste Version deines Produkts. Es ist das kleinste Ding, mit dem du <strong>eine Annahme testest</strong>.</p>'+
  '<div class="scr"><table><thead><tr><th>Form</th><th>Testet</th><th>Aufwand</th></tr></thead><tbody>'+
  '<tr><td><strong>Landing Page</strong></td><td>Interesse, Botschaft</td><td>1 Tag</td></tr>'+
  '<tr><td><strong>Klickdummy</strong></td><td>Verständlichkeit, Ablauf</td><td>2–3 Tage</td></tr>'+
  '<tr><td><strong>Concierge</strong> (manuell im Hintergrund)</td><td>echten Nutzen, Zahlungsbereitschaft</td><td>1 Woche</td></tr>'+
  '<tr><td><strong>Vorverkauf</strong></td><td>ob jemand wirklich zahlt</td><td>Tage</td></tr>'+
  '<tr><td><strong>Funktionierender Kern</strong></td><td>Nutzung, Wiederkehr</td><td>4–8 Wochen</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Die Frage, die den Umfang festlegt</h2>'+
  '<p>Nicht "was gehört dazu", sondern: <strong>ohne welche eine Funktion ist das Produkt sinnlos?</strong> Login, Dashboard, Einstellungen, Onboarding-Tour und App-Store-Version gehören fast nie in ein MVP.</p>'+
  '<h2>Erste zehn Nutzer:innen</h2>'+
  '<p>Handverlesen, persönlich onboarded, außerhalb von Familie und Freundeskreis. Zehn Menschen, die es wirklich nutzen, sind mehr wert als 500 Anmeldungen, die nie zurückkommen — und der einzige Weg zu echtem Feedback.</p>'+
  '<div class="hint"><b>Abbruchkriterium vorher festlegen.</b> "Wenn nach vier Wochen weniger als drei von zehn wiederkommen, ändern wir die Annahme." Ohne dieses Kriterium baut man ewig weiter.</div>'+
  '<h2>Product-Market-Fit erkennen</h2>'+
  '<p>Nicht am Umsatz, sondern an der <strong>Retention-Kurve</strong>: Wenn der Anteil der Nutzer:innen, die nach Woche 4 und 8 noch aktiv sind, sich auf einem Niveau stabilisiert statt gegen Null zu laufen, zieht der Markt. Vorher zu skalieren verbrennt Geld.</p>' });

A({ id:'strategie', t:'Geschäftsmodell, Markt & Pitch', sub:'Von der Idee zur These, die jemand versteht', html:
  '<h2>Markt bottom-up rechnen</h2>'+
  '<p>Drei Ebenen, jede mit einer eigenen Rechnung:</p>'+
  '<div class="scr"><table><thead><tr><th></th><th>Bedeutung</th><th>Rechnung</th></tr></thead><tbody>'+
  '<tr><td><strong>TAM</strong></td><td>Gesamtmarkt</td><td>alle potenziellen Kund:innen × Jahresumsatz</td></tr>'+
  '<tr><td><strong>SAM</strong></td><td>erreichbarer Markt</td><td>nur deine Region, Sprache, Segment</td></tr>'+
  '<tr><td><strong>SOM</strong></td><td>realistischer Anteil</td><td>was ihr in 3–5 Jahren schaffen könnt</td></tr>'+
  '</tbody></table></div>'+
  '<p>Bottom-up heißt: Anzahl Kund:innen × realistischer Jahresumsatz. Eine Zahl aus einer Marktstudie ("der Markt wächst auf 40 Mrd.") überzeugt niemanden, weil sie nichts über euch sagt.</p>'+
  '<h2>Geschäftsmodell auf einer Seite</h2>'+
  '<p>Lean Canvas oder Business Model Canvas sind gut, um im Team dieselbe Sprache zu finden — kein Ersatz für Kundengespräche. Entscheidend sind vier Zeilen: <strong>wer zahlt, wie viel, wofür, wie oft.</strong></p>'+
  '<h2>Das Pitch Deck in 11 Slides</h2>'+
  '<ol><li><strong>Problem</strong> — wer leidet, wie oft, was kostet es. Ein Satz, ein Beleg.</li>'+
  '<li><strong>Lösung</strong> — in der Sprache der Kund:innen.</li>'+
  '<li><strong>Markt</strong> — TAM/SAM/SOM, bottom-up.</li>'+
  '<li><strong>Produkt</strong> — zwei Screenshots oder 20 Sekunden Demo, kein Feature-Katalog.</li>'+
  '<li><strong>Traction</strong> — die Kurve. Wenn es sie gibt, gehört sie weit nach vorn.</li>'+
  '<li><strong>Geschäftsmodell</strong> — Preis, Frequenz, Marge.</li>'+
  '<li><strong>Wettbewerb</strong> — ehrlich, inklusive Status quo.</li>'+
  '<li><strong>Go-to-Market</strong> — die nächsten 100 Kund:innen, nicht die nächsten 100.000.</li>'+
  '<li><strong>Team</strong> — warum gerade ihr, mit Belegen statt Lebensläufen.</li>'+
  '<li><strong>Ask &amp; Plan</strong> — wie viel, wofür, welche Meilensteine in 18 Monaten.</li>'+
  '<li><strong>Vision</strong> — wie groß das werden kann.</li></ol>'+
  '<div class="hint"><b>Zwei Versionen:</b> ein <em>Send Deck</em>, das ohne dich funktioniert (mehr Text), und ein Präsentationsdeck für den Raum (fast kein Text). Dazu ein One-Pager — das Dokument, das ein Angel an drei Kollegen weiterschickt.</div>'+
  '<h2>Der 3-Minuten-Pitch</h2>'+
  '<div class="scr"><table><thead><tr><th>Zeit</th><th>Inhalt</th></tr></thead><tbody>'+
  '<tr><td>0:00–0:20</td><td>Konkrete Szene: eine Person, ein Problem, heute</td></tr>'+
  '<tr><td>0:20–0:40</td><td>Was ihr macht, in einem Satz</td></tr>'+
  '<tr><td>0:40–1:20</td><td>Demo oder Screenshots — zeigen, nicht beschreiben</td></tr>'+
  '<tr><td>1:20–2:00</td><td>Traction und was ihr gelernt habt</td></tr>'+
  '<tr><td>2:00–2:30</td><td>Markt und Geschäftsmodell</td></tr>'+
  '<tr><td>2:30–3:00</td><td>Team, Ask, ein Satz Vision</td></tr>'+
  '</tbody></table></div>'+
  '<p>Laut üben mit Stoppuhr, mindestens zehn Mal. Ersten und letzten Satz auswendig. Live-Demo nur mit Aufnahme als Backup.</p>' });

A({ id:'rechtsformen', t:'Rechtsformen & Unternehmensrecht', sub:'GbR, UG, GmbH, AG — und wann welche', html:
  '<p>Die Rechtsform entscheidet über Haftung, Startkosten, Steuern und darüber, ob Investor:innen überhaupt einsteigen können. Änderbar, aber jede Änderung kostet Geld und Zeit.</p>'+
  '<div class="scr"><table><thead><tr><th></th><th>GbR</th><th>UG (haftungsbeschränkt)</th><th>GmbH</th></tr></thead><tbody>'+
  '<tr><th>Kapital</th><td>keins</td><td>ab 1 €</td><td>25.000 €, mind. 12.500 € eingezahlt</td></tr>'+
  '<tr><th>Haftung</th><td>privat, unbeschränkt</td><td>auf Gesellschaftsvermögen</td><td>auf Gesellschaftsvermögen</td></tr>'+
  '<tr><th>Notar</th><td>nein</td><td>ja</td><td>ja</td></tr>'+
  '<tr><th>Gründungskosten</th><td>~50 €</td><td>~400–900 €</td><td>~600–1.200 €</td></tr>'+
  '<tr><th>Buchführung</th><td>EÜR</td><td>Bilanz</td><td>Bilanz</td></tr>'+
  '<tr><th>Gewinnbesteuerung</th><td>Einkommensteuer der Gesellschafter</td><td>Körperschaft- + Gewerbesteuer</td><td>Körperschaft- + Gewerbesteuer</td></tr>'+
  '<tr><th>VC-fähig</th><td>nein</td><td>eingeschränkt</td><td>ja</td></tr>'+
  '</tbody></table></div>'+
  '<h2>GbR — zum Testen</h2>'+
  '<p>Entsteht praktisch automatisch, sobald zwei Personen gemeinsam wirtschaftlich tätig werden. Kein Kapital, kein Notar — aber <strong>volle persönliche Haftung, auch für Fehler der Mitgründer:innen</strong>. Seit 2024 als eGbR im Gesellschaftsregister eintragbar. Gut für erste Umsätze, ungeeignet sobald echtes Risiko oder Kapital im Spiel ist.</p>'+
  '<h2>UG — die pragmatische Kapitalgesellschaft</h2>'+
  '<p>Rechtlich eine GmbH mit kleinem Kapital. Formal ab 1 € möglich, praktisch solltest du 1.000–3.000 € einzahlen, sonst ist die Gesellschaft ab dem Notartermin insolvenzreif. Pflicht: <strong>25&nbsp;% des Jahresüberschusses in die gesetzliche Rücklage</strong>, bis 25.000 € erreicht sind — dann Umwandlung in eine GmbH möglich.</p>'+
  '<h2>GmbH — der Standard mit Kapitalplänen</h2>'+
  '<p>Was VCs erwarten und was Beteiligungsverträge, Anteilsklassen und Optionspools sauber abbildet. Wenn absehbar Fremdkapital kommt, ist der Umweg über die UG oft teurer als der direkte Weg.</p>'+
  '<h2>Die anderen Formen</h2>'+
  '<ul><li><strong>Einzelunternehmen</strong> — allein, kein Kapital, volle Haftung, einfachste Buchführung.</li>'+
  '<li><strong>GmbH &amp; Co. KG</strong> — steuerlich flexibel, gesellschaftsrechtlich komplex, bei Familien- und Immobilienstrukturen verbreitet.</li>'+
  '<li><strong>AG</strong> — Aufsichtsrat, strenge Formalien, sinnvoll erst bei großen Runden oder Börsenambitionen.</li>'+
  '<li><strong>eG (Genossenschaft)</strong> — bei geteilter Trägerschaft und Mitgliederlogik.</li></ul>'+
  '<h2>Der Gründungsablauf bei UG und GmbH</h2>'+
  '<ol><li>Name, Gesellschafter, Anteile und Geschäftsführung festlegen</li>'+
  '<li><strong>Gesellschaftsvertrag:</strong> Musterprotokoll (bis 3 Gesellschafter, 1 Geschäftsführer — günstig, aber ohne Vesting und Sonderrechte) oder individueller Vertrag</li>'+
  '<li>Notartermin: Beurkundung, Geschäftsführerbestellung. Ab hier existiert die "UG i.&nbsp;G." und kann handeln — mit persönlicher Haftung bis zur Eintragung</li>'+
  '<li>Geschäftskonto eröffnen, Stammkapital einzahlen, Nachweis an den Notar</li>'+
  '<li>Handelsregister-Eintragung beim Amtsgericht — damit endet die persönliche Haftung für neue Verbindlichkeiten</li>'+
  '<li>Gewerbeanmeldung, dann Fragebogen zur steuerlichen Erfassung über ELSTER</li></ol>'+
  '<div class="hint hint--alert"><b>Keine Rechtsberatung.</b> Dieser Überblick ist Orientierung, kein Ersatz für Notar, Kanzlei oder Steuerberatung. Bei Beteiligungen und Gesellschaftsverträgen gehört fachlicher Rat dazu.</div>' });

A({ id:'gesellschaftsrecht', t:'Gesellschaftsrecht & Verträge', sub:'Gesellschaftervereinbarung, Vesting, Exit-Klauseln', html:
  '<p>Die meisten Startups scheitern nicht am Markt, sondern am Team. Die gesellschaftsrechtlichen Dokumente beantworten die Fragen, die man ungern stellt — <strong>solange sie noch hypothetisch sind</strong>.</p>'+
  '<h2>Die drei Ebenen</h2>'+
  '<div class="scr"><table><thead><tr><th>Dokument</th><th>Was drin steht</th><th>Form</th></tr></thead><tbody>'+
  '<tr><td><strong>Gesellschaftsvertrag (Satzung)</strong></td><td>Firma, Sitz, Zweck, Kapital, Geschäftsführung — öffentlich einsehbar</td><td>notariell</td></tr>'+
  '<tr><td><strong>Gesellschaftervereinbarung (SHA)</strong></td><td>Vesting, Vetorechte, Verkaufsregeln, Informationsrechte — nicht öffentlich</td><td>meist notariell</td></tr>'+
  '<tr><td><strong>Founders Agreement</strong></td><td>Vorstufe vor der Gründung: Rollen, Anteile, IP, Commitment</td><td>schriftlich</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Was in eine Gründervereinbarung gehört</h2>'+
  '<ul><li><strong>Anteile</strong> und wie sie zustande kommen</li>'+
  '<li><strong>Rollen und Entscheidungsrechte</strong> — wer entscheidet allein, was braucht Einstimmigkeit</li>'+
  '<li><strong>Commitment</strong> — Vollzeit, Teilzeit, ab wann, neben welchem Job</li>'+
  '<li><strong>IP-Übertragung</strong> — alles, was am Projekt entsteht, gehört der Gesellschaft</li>'+
  '<li><strong>Vesting</strong> inklusive Good- und Bad-Leaver-Regeln</li>'+
  '<li><strong>Exit-Fall</strong> — wer darf verkaufen, wer muss mitziehen</li>'+
  '<li><strong>Konfliktweg</strong> — Mediation vor Gericht</li></ul>'+
  '<h2>Vesting</h2>'+
  '<p>Anteile werden über Zeit erdient. Marktstandard: <strong>vier Jahre linear, ein Jahr Cliff</strong>. Wer vor Ablauf des ersten Jahres geht, behält nichts; danach wächst der unverfallbare Teil monatlich.</p>'+
  '<ul><li><strong>Good Leaver</strong> (Krankheit, einvernehmlicher Abgang) behält das Erdiente.</li>'+
  '<li><strong>Bad Leaver</strong> (Kündigung ohne Grund, Vertragsbruch) verliert mehr — oft auch erdiente Anteile.</li></ul>'+
  '<h2>Equity fair aufteilen</h2>'+
  '<p>Gleichverteilung ist bequem, aber nicht automatisch richtig. Entscheidend ist der <strong>Beitrag ab jetzt</strong>, nicht wer die Idee hatte: Vollzeit-Commitment, Risiko, unersetzbare Fähigkeiten. Wer nur nebenbei mitmacht, bekommt keinen Gründeranteil, sondern Optionen.</p>'+
  '<div class="hint hint--alert"><b>Zwei Warnsignale, die spätere Runden verhindern:</b> ein <em>Dead-Equity</em>-Gesellschafter, der 20&nbsp;% hält und nicht mehr mitarbeitet, und ein Cap Table, in dem die aktiven Gründer:innen nach der Seed-Runde zusammen unter 50&nbsp;% liegen.</div>'+
  '<h2>Typische Klauseln aus dem Beteiligungsvertrag</h2>'+
  '<ul><li><strong>Drag Along</strong> — Minderheit muss bei einem Mehrheitsverkauf mitverkaufen</li>'+
  '<li><strong>Tag Along</strong> — Minderheit darf zu gleichen Bedingungen mitverkaufen</li>'+
  '<li><strong>Vorerwerbsrecht</strong> — bestehende Gesellschafter dürfen zuerst kaufen</li>'+
  '<li><strong>Wettbewerbsverbot</strong> — zeitlich und sachlich begrenzt, sonst unwirksam</li>'+
  '<li><strong>Informationsrechte</strong> — monatliches oder quartalsweises Reporting an Investor:innen</li></ul>' });

A({ id:'versicherungen', t:'Versicherungen für Startups', sub:'Was wirklich nötig ist — und was warten kann', html:
  '<p>Versicherungen sind das Thema, das man aufschiebt, bis etwas passiert. Die Reihenfolge unten ist nach Dringlichkeit sortiert, nicht nach Verkaufsdruck.</p>'+
  '<h2>Früh — ab dem ersten Kundenkontakt</h2>'+
  '<div class="scr"><table><thead><tr><th>Versicherung</th><th>Deckt</th><th>Für wen</th></tr></thead><tbody>'+
  '<tr><td><strong>Betriebshaftpflicht</strong></td><td>Personen- und Sachschäden, die dein Betrieb verursacht</td><td>praktisch alle</td></tr>'+
  '<tr><td><strong>Berufs-/Vermögensschadenhaftpflicht</strong></td><td>finanzielle Schäden durch Beratungs- oder Softwarefehler</td><td>Software, Beratung, Agentur</td></tr>'+
  '<tr><td><strong>Rechtsschutz (Firmen)</strong></td><td>Prozesskosten bei Streit mit Kunden, Vermietern, Behörden</td><td>optional, aber beruhigend</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Mit Team und Enterprise-Kunden</h2>'+
  '<ul><li><strong>Cyber-Versicherung</strong> — Datenpanne, Ransomware, Betriebsunterbrechung, Kosten der Meldepflicht. Wird von Enterprise-Kunden zunehmend verlangt.</li>'+
  '<li><strong>D&amp;O (Directors &amp; Officers)</strong> — Manager-Haftpflicht: Geschäftsführer haften bei Pflichtverletzungen <strong>persönlich und unbegrenzt</strong> mit dem Privatvermögen. Sobald es Fremdkapital, Investor:innen oder Angestellte gibt, gehört D&amp;O auf die Liste.</li>'+
  '<li><strong>Inhalts-/Elektronikversicherung</strong> — Hardware, Laborausstattung, Prototypen.</li></ul>'+
  '<h2>Pflicht statt Wahl</h2>'+
  '<ul><li><strong>Berufsgenossenschaft</strong> — gesetzliche Unfallversicherung, Anmeldung ist Pflicht, sobald du Personal beschäftigst.</li>'+
  '<li><strong>Kranken-, Renten-, Arbeitslosen- und Pflegeversicherung</strong> für Angestellte über die Lohnabrechnung.</li>'+
  '<li><strong>Eigene Krankenversicherung</strong> — bei Gründung aus dem Studium oder aus der Anstellung heraus rechtzeitig mit der Kasse klären.</li></ul>'+
  '<div class="hint"><b>Praktisch:</b> Ein unabhängiger Makler mit Startup-Erfahrung ist bei der Erstauswahl meist günstiger als drei Einzelabschlüsse. Wichtig ist die Deckungssumme — bei Enterprise-Verträgen werden oft 1–5 Mio.&nbsp;€ verlangt.</div>' });

A({ id:'finanzierungsarten', t:'Finanzierung & Investment-Arten', sub:'Bootstrapping, Zuschüsse, Angels, VC, Venture Debt', html:
  '<p>Fast jedes Team fragt zu früh nach Equity-Kapital. Die Reihenfolge, die dich am wenigsten kostet:</p>'+
  '<ol><li><strong>Eigene Umsätze.</strong> Der einzige Euro, der nicht verwässert — und der dich sofort disziplinierter macht.</li>'+
  '<li><strong>Förderung und Stipendien.</strong> Zuschüsse, Wettbewerbe, Stipendien. Nicht verwässernd, dafür mit Antragsaufwand und Fristen.</li>'+
  '<li><strong>Business Angels.</strong> Ticket meist 25–250 T€, oft als Wandeldarlehen. Das Netzwerk ist meist wertvoller als das Geld.</li>'+
  '<li><strong>Pre-Seed- und Seed-VC.</strong> Ab etwa 500 T€, erwartet Team, Traction und einen großen Markt.</li>'+
  '<li><strong>Fremdkapital.</strong> Förderdarlehen, Bankkredit, Venture Debt. Günstig, aber ohne Umsatz oder Sicherheiten schwer zu bekommen.</li></ol>'+
  '<h2>Die Formen im Vergleich</h2>'+
  '<div class="scr"><table><thead><tr><th>Form</th><th>Kosten</th><th>Verwässerung</th><th>Geeignet ab</th></tr></thead><tbody>'+
  '<tr><td><strong>Bootstrapping</strong></td><td>Zeit</td><td>keine</td><td>sofort</td></tr>'+
  '<tr><td><strong>Zuschuss / Stipendium</strong></td><td>Antragsaufwand, Nachweise</td><td>keine</td><td>Ideation</td></tr>'+
  '<tr><td><strong>Wettbewerb</strong></td><td>Bewerbung, Pitch</td><td>keine</td><td>Ideation</td></tr>'+
  '<tr><td><strong>Crowdfunding</strong></td><td>Kampagnenarbeit, Fulfillment</td><td>keine (Reward) / ja (Equity)</td><td>fertiges Produktversprechen</td></tr>'+
  '<tr><td><strong>Wandeldarlehen</strong></td><td>Zinsen, Discount, Cap</td><td>später</td><td>Pre-Seed</td></tr>'+
  '<tr><td><strong>Business Angel</strong></td><td>Anteile, Reporting</td><td>5–15 %</td><td>Pre-Seed</td></tr>'+
  '<tr><td><strong>VC</strong></td><td>Anteile, Kontrollrechte</td><td>15–25 % pro Runde</td><td>Traction</td></tr>'+
  '<tr><td><strong>Förderdarlehen / KfW</strong></td><td>Zinsen, teils Haftungsfreistellung</td><td>keine</td><td>Umsatz oder Sicherheiten</td></tr>'+
  '<tr><td><strong>Venture Debt</strong></td><td>hohe Zinsen + Warrants</td><td>gering</td><td>nach einer VC-Runde</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Wie viel brauchst du wirklich</h2>'+
  '<p>Nicht "so viel wie möglich", sondern: <strong>welche drei Meilensteine bringen mich in eine Position, in der die nächste Runde leichter ist</strong> — und was kosten sie plus Puffer? Übliche Zielgröße sind 18 Monate Runway. Unter zwölf Monaten verhandelst du aus der Schwäche, weil Fundraising selbst drei bis sechs Monate dauert.</p>'+
  '<h2>Angel vs. VC</h2>'+
  '<div class="scr"><table><thead><tr><th></th><th>Business Angel</th><th>Venture Capital</th></tr></thead><tbody>'+
  '<tr><th>Geld</th><td>eigenes</td><td>Fondsgeld von Investoren (LPs)</td></tr>'+
  '<tr><th>Ticket</th><td>25–250 T€</td><td>ab ca. 500 T€</td></tr>'+
  '<tr><th>Entscheidung</th><td>Tage bis Wochen</td><td>Wochen bis Monate, Komitee</td></tr>'+
  '<tr><th>Sucht</th><td>Team, Nähe zum Thema</td><td>Marktgröße, Skalierbarkeit, Fondsrendite</td></tr>'+
  '</tbody></table></div>'+
  '<p>Ein Fonds braucht wenige Beteiligungen, die das Kapital des <em>gesamten</em> Fonds zurückholen. Daher die Frage "kann daraus ein sehr großes Unternehmen werden" — nicht "ist das ein gutes Geschäft". Ein solides Unternehmen mit 2 Mio.&nbsp;€ Jahresumsatz ist ein Erfolg für dich und uninteressant für einen VC. Das ist keine Kritik, sondern Mathematik.</p>'+
  '<div class="hint"><b>Zugang:</b> Warme Einführungen über Mentor:innen, Portfolio-Gründer:innen und Programme schlagen Kaltakquise deutlich. 30–50 Kontakte pro Runde sind normal — parallel führen, nicht sequenziell. Wiederkehrende Einwände sind Produktfeedback.</div>' });

A({ id:'termsheet', t:'Investment-Terminologie & Term Sheets', sub:'Die Klauseln, die mehr entscheiden als die Bewertung', html:
  '<p>Ein Term Sheet ist die unverbindliche Absichtserklärung vor dem Beteiligungsvertrag. Alle reden über die Bewertung — entscheidend sind die Klauseln darunter.</p>'+
  '<div class="scr"><table><thead><tr><th>Klausel</th><th>Worum es geht</th><th>Marktüblich</th></tr></thead><tbody>'+
  '<tr><td><strong>Pre-/Post-Money</strong></td><td>Bewertung vor oder nach Einzahlung</td><td>immer explizit klären</td></tr>'+
  '<tr><td><strong>Liquidationspräferenz</strong></td><td>wer beim Exit zuerst Geld sieht</td><td>1×, non-participating</td></tr>'+
  '<tr><td><strong>Optionspool</strong></td><td>Größe und wer verwässert</td><td>10–15 %</td></tr>'+
  '<tr><td><strong>Founder Vesting</strong></td><td>Gründeranteile über Zeit</td><td>4 Jahre, 1 Jahr Cliff</td></tr>'+
  '<tr><td><strong>Vetorechte</strong></td><td>welche Beschlüsse Zustimmung brauchen</td><td>eng gefasste Liste</td></tr>'+
  '<tr><td><strong>Pro-Rata</strong></td><td>Recht, in Folgerunden mitzugehen</td><td>üblich</td></tr>'+
  '<tr><td><strong>Drag / Tag Along</strong></td><td>Mitverkaufspflicht und -recht</td><td>üblich, Schwellen prüfen</td></tr>'+
  '<tr><td><strong>Anti-Dilution</strong></td><td>Schutz bei niedrigerer Folgebewertung</td><td>broad-based weighted average</td></tr>'+
  '<tr><td><strong>Exklusivität</strong></td><td>keine Parallelverhandlung während der DD</td><td>30–60 Tage</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Liquidationspräferenz in einem Beispiel</h2>'+
  '<p>Investor zahlt 1 Mio.&nbsp;€ für 20&nbsp;%, Exit für 3 Mio.&nbsp;€.</p>'+
  '<ul><li><strong>1× non-participating:</strong> Investor nimmt entweder 1 Mio. zurück oder 20&nbsp;% von 3 Mio. (600 T€) — er nimmt die 1 Mio. Rest für die Gründer: 2 Mio.</li>'+
  '<li><strong>1× participating:</strong> Investor nimmt 1 Mio. <em>und</em> 20&nbsp;% der restlichen 2 Mio. (400 T€) = 1,4 Mio. Rest: 1,6 Mio.</li></ul>'+
  '<p>Dieselbe Bewertung, 400 T€ Unterschied. Deshalb ist "participating" ein Warnsignal.</p>'+
  '<h2>Rote Flaggen</h2>'+
  '<ul><li><strong>Participating</strong> Liquidationspräferenz oder ein Multiple über 1×</li>'+
  '<li><strong>Full-Ratchet</strong> Anti-Dilution</li>'+
  '<li><strong>Vetorechte auf Alltagsentscheidungen</strong> statt auf Grundlagengeschäfte</li>'+
  '<li><strong>Exklusivität über mehrere Monate</strong> ohne Gegenleistung</li>'+
  '<li>Ein <strong>Board-Sitz plus Sperrminorität</strong> in einer Pre-Seed-Runde</li></ul>'+
  '<h2>Wandeldarlehen und SAFE</h2>'+
  '<p>In Deutschland ist das <strong>Wandeldarlehen</strong> der übliche Weg für schnelles Pre-Seed-Geld: ein Darlehen, das in der nächsten Runde in Anteile wandelt — mit <strong>Discount</strong> (z.&nbsp;B. 20&nbsp;% günstiger als die neue Runde) und <strong>Cap</strong> (Bewertungsobergrenze). Der US-Standard <strong>SAFE</strong> ist rechtlich nicht deckungsgleich; wenn ein Investor "SAFE" sagt, ist hier meist ein Wandeldarlehen gemeint.</p>'+
  '<div class="hint hint--alert"><b>Nie ohne Kanzlei unterschreiben.</b> Ein Term Sheet ist meist rechtlich unverbindlich, prägt aber den Beteiligungsvertrag fast vollständig. Keine Anlage- oder Rechtsberatung.</div>' });

A({ id:'bewertung', t:'Unternehmensbewertung & Cap Table', sub:'Bewertungsmethoden, Verwässerung, Due Diligence', html:
  '<h2>Wie früh bewertet wird</h2>'+
  '<p>In der Frühphase gibt es keine "richtige" Bewertung — es gibt die Zahl, auf die sich zwei Parteien einigen. Trotzdem gibt es Methoden, an denen sich Investor:innen orientieren:</p>'+
  '<div class="scr"><table><thead><tr><th>Methode</th><th>Wie</th><th>Sinnvoll ab</th></tr></thead><tbody>'+
  '<tr><td><strong>Multiple</strong></td><td>Umsatz oder ARR × branchenüblicher Faktor</td><td>wiederkehrender Umsatz</td></tr>'+
  '<tr><td><strong>DCF</strong></td><td>zukünftige Cashflows, abdiskontiert</td><td>planbare Cashflows</td></tr>'+
  '<tr><td><strong>VC-Methode</strong></td><td>vom erwarteten Exit zurückgerechnet auf die nötige Rendite</td><td>Pre-Seed bis Seed</td></tr>'+
  '<tr><td><strong>Vergleichbare Runden</strong></td><td>was ähnliche Teams in der Region gerade bekommen</td><td>immer</td></tr>'+
  '</tbody></table></div>'+
  '<div class="hint"><b>Der häufigste teure Denkfehler:</b> Bewertung maximieren. Eine zu hohe erste Runde macht die nächste schwer und endet in einer Down Round. Passende Bewertung plus guter Investor schlägt hohe Bewertung plus stiller Geldgeber.</div>'+
  '<h2>Cap Table</h2>'+
  '<p>Die Liste, wer welche Anteile hält — das erste Dokument, das ein Investor anschaut, und der Ort, an dem frühe Fehler dauerhaft sichtbar bleiben. Gehört von Tag 1 in eine Tabelle: alle Anteile, <strong>alle Wandeldarlehen</strong>, alle Optionen, alle Nebenabreden.</p>'+
  '<h2>Verwässerung rechnen</h2>'+
  '<p>Bei jeder Runde sinkt dein Prozentsatz — bei einem größeren Kuchen. Beispiel: Du hältst 50&nbsp;%, die Runde gibt 20&nbsp;% neue Anteile aus. Danach hältst du 50&nbsp;% × 80&nbsp;% = <strong>40&nbsp;%</strong>. 15&nbsp;% an einem Unternehmen, das 100 Mio.&nbsp;€ wert ist, schlagen 100&nbsp;% an einem, das nichts wert ist.</p>'+
  '<h2>Optionspool</h2>'+
  '<p>10–15&nbsp;% für künftige Mitarbeitende. In Deutschland meist als <strong>VSOP</strong> (virtuelle Anteile) statt echter Optionen, weil echte Anteile bei Ausgabe steuerpflichtig sein können. Wer den Pool anlegt, verwässert — deshalb steht im Term Sheet, ob er <em>vor</em> oder <em>nach</em> dem Investment gerechnet wird.</p>'+
  '<h2>Due Diligence & Datenraum</h2>'+
  '<p>Nach der Zusage kommt die Prüfung. Teams, die dann erst Dokumente suchen, verlieren Wochen — und Wochen kosten Verhandlungsposition.</p>'+
  '<ul><li><strong>Gesellschaft:</strong> Gesellschaftsvertrag, Handelsregisterauszug, Gesellschafterliste, Beschlüsse</li>'+
  '<li><strong>Cap Table</strong> inklusive Wandeldarlehen, Optionen, Nebenabreden</li>'+
  '<li><strong>Finanzen:</strong> Jahresabschlüsse, aktuelle GuV, Finanzplan, Bankauszüge</li>'+
  '<li><strong>Verträge:</strong> Kunden, Lieferanten, Miete, alles mit langer Bindung</li>'+
  '<li><strong>Team:</strong> Arbeits-, Freelancer- und Gründerverträge, IP-Übertragungen</li>'+
  '<li><strong>IP:</strong> Marken, Patente, Lizenzen, Open-Source-Nutzung</li>'+
  '<li><strong>Daten:</strong> DSGVO-Dokumentation, AVV, Verarbeitungsverzeichnis</li>'+
  '<li><strong>Metriken:</strong> die Rohdaten hinter den Zahlen im Deck</li></ul>'+
  '<h2>Die vier häufigsten Funde</h2>'+
  '<ol><li><strong>IP gehört nicht der Gesellschaft</strong> — ein Freelancer oder Ex-Gründer hat nie übertragen.</li>'+
  '<li><strong>Kein Vesting</strong> oder ein inaktiver Gesellschafter mit großem Anteil.</li>'+
  '<li><strong>Mündliche Nebenabreden</strong>, die im Cap Table fehlen.</li>'+
  '<li><strong>Metriken lassen sich nicht reproduzieren</strong> — der teuerste Fund, weil er Vertrauen kostet.</li></ol>' });
</script>
<script>
A({ id:'steuerarten', t:'Steuerarten & Steuersystem', sub:'Körperschaft-, Gewerbe-, Umsatz- und Lohnsteuer', html:
  '<p>Für eine UG oder GmbH sind vier Steuerarten relevant. Bei GbR und Einzelunternehmen tritt die Einkommensteuer der Gesellschafter an die Stelle der Körperschaftsteuer.</p>'+
  '<div class="scr"><table><thead><tr><th>Steuer</th><th>Höhe</th><th>Worauf</th></tr></thead><tbody>'+
  '<tr><td><strong>Körperschaftsteuer</strong></td><td>15 % + 5,5 % Soli darauf = 15,825 %</td><td>Gewinn der Kapitalgesellschaft</td></tr>'+
  '<tr><td><strong>Gewerbesteuer</strong></td><td>3,5 % Steuermesszahl × Hebesatz der Gemeinde</td><td>Gewerbeertrag</td></tr>'+
  '<tr><td><strong>Umsatzsteuer</strong></td><td>19 % (ermäßigt 7 %)</td><td>Umsatz — durchlaufend, nicht deine Kosten</td></tr>'+
  '<tr><td><strong>Lohnsteuer</strong></td><td>nach Steuerklasse</td><td>Gehälter, inkl. Geschäftsführergehalt</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Rechenbeispiel</h2>'+
  '<p>GmbH mit 100.000 € Gewinn, Hebesatz 460&nbsp;%:</p>'+
  '<ul><li>Körperschaftsteuer: 15.000 € + 825 € Soli = <strong>15.825 €</strong></li>'+
  '<li>Gewerbesteuer: 100.000 € × 3,5&nbsp;% = 3.500 € Messbetrag × 460&nbsp;% = <strong>16.100 €</strong></li>'+
  '<li>Gesamt: rund <strong>32 %</strong> — bleiben ca. 68.000 € in der Gesellschaft</li></ul>'+
  '<p>Der Hebesatz unterscheidet sich je Gemeinde deutlich (Großstädte liegen häufig bei 440–500&nbsp;%, manche Umlandgemeinden deutlich darunter) — bei der Sitzwahl also mitrechnen. Aktuelle Hebesätze stehen bei der jeweiligen Stadt.</p>'+
  '<h2>Umsatzsteuer verstehen</h2>'+
  '<p>Du sammelst sie für den Staat ein und ziehst die Umsatzsteuer ab, die du selbst gezahlt hast (Vorsteuer). Die Differenz wird abgeführt. <strong>Der teuerste Anfängerfehler:</strong> vereinnahmte Umsatzsteuer als eigenes Geld behandeln. Sie gehört von Anfang an nicht dir.</p>'+
  '<h2>Kleinunternehmerregelung (§ 19 UStG)</h2>'+
  '<p>Seit 2025: Umsatz im Vorjahr <strong>bis 25.000 €</strong> und im laufenden Jahr <strong>bis 100.000 €</strong>. Dann keine Umsatzsteuer auf Rechnungen — aber auch <strong>kein Vorsteuerabzug</strong>.</p>'+
  '<ul><li><strong>Sinnvoll</strong> bei Endkundengeschäft mit wenig Einkauf.</li>'+
  '<li><strong>Nachteilig</strong>, wenn du viel investierst oder an Unternehmen verkaufst, die die Umsatzsteuer ohnehin zurückholen.</li></ul>'+
  '<h2>Weitere Steuern, die auftauchen können</h2>'+
  '<ul><li><strong>Kapitalertragsteuer</strong> — 25&nbsp;% + Soli auf Gewinnausschüttungen an Gesellschafter</li>'+
  '<li><strong>Reverse Charge</strong> — bei B2B-Leistungen ins EU-Ausland schuldet der Kunde die USt; USt-IdNr. beider Seiten prüfen</li>'+
  '<li><strong>Bauabzugsteuer, Künstlersozialabgabe</strong> — branchenspezifisch, aber teuer wenn übersehen</li></ul>'+
  '<div class="hint hint--alert"><b>Fristen:</b> USt-Voranmeldungen monatlich oder quartalsweise — das Finanzamt legt den Rhythmus fest, Neugründungen melden häufig monatlich. Verspätungen kosten Zuschläge, nicht Kulanz. Keine Steuerberatung — Sätze und Grenzen ändern sich.</div>' });

A({ id:'buchhaltung', t:'Buchhaltung & Jahresabschluss', sub:'EÜR, Bilanz, GuV, Cashflow und die Fristen', html:
  '<p>Von der Einnahmen-Überschuss-Rechnung bis zur Bilanzierung: Buchhaltung ist kein Papierkram, den man später aufräumt. Ein Jahr unsortierte Belege kostet beim Steuerberater ein Vielfaches — und fällt in der Due Diligence auf.</p>'+
  '<div class="hint hint--alert"><b>Buchführungspflicht nicht erfüllen ist eine Straftat.</b> Folgen: Steuerschätzung durch das Finanzamt (meist zu deinen Ungunsten), Geldbußen bis 25.000 €, bei Vorsatz Freiheitsstrafe bis zu einem Jahr, bei Insolvenz Verdacht auf Insolvenzverschleppung.</div>'+
  '<h2>Aufbewahrungspflicht</h2>'+
  '<ul><li><strong>10 Jahre</strong> für Bücher, Jahresabschlüsse, Inventare, Belege</li>'+
  '<li><strong>6 Jahre</strong> für Geschäftsbriefe und Lieferscheine</li>'+
  '<li>Aufbewahrungsort: in Deutschland (oder EU mit Zugriff)</li>'+
  '<li>Form: digital oder Papier — aber <strong>unveränderbar</strong> (GoBD)</li></ul>'+
  '<h2>EÜR oder doppelte Buchführung?</h2>'+
  '<div class="scr"><table><thead><tr><th></th><th>EÜR</th><th>Doppelte Buchführung</th></tr></thead><tbody>'+
  '<tr><th>Prinzip</th><td>Zufluss/Abfluss von Geld</td><td>jede Buchung zweimal: Soll und Haben</td></tr>'+
  '<tr><th>Wer</th><td>Einzelunternehmen, GbR, Freiberufler unter den Grenzen</td><td>alle Kapitalgesellschaften (UG, GmbH, AG)</td></tr>'+
  '<tr><th>Ergebnis</th><td>Einnahmen minus Ausgaben</td><td>Bilanz + GuV</td></tr>'+
  '<tr><th>Aufwand</th><td>gering</td><td>hoch, Steuerberatung faktisch nötig</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Bilanz, GuV, Cashflow</h2>'+
  '<ul><li><strong>Bilanz</strong> — Momentaufnahme: Was besitzt das Unternehmen (Aktiva), woher kommt das Geld (Passiva)?</li>'+
  '<li><strong>GuV</strong> — wie viel Gewinn oder Verlust in der Periode entstanden ist</li>'+
  '<li><strong>Cashflow-Rechnung</strong> — wie viel Geld tatsächlich geflossen ist, getrennt in operativ, Investition und Finanzierung</li></ul>'+
  '<div class="hint hint--alert"><b>Gewinn ≠ Cash.</b> Du kannst profitabel sein und trotzdem pleite gehen: 100.000 € Jahresgewinn, aber Kunden zahlen erst nach 60 Tagen und Lieferanten sofort — kein Cash für Gehälter. <b>Cash bezahlt Gehälter, Cash hält dich am Leben.</b> Regel: mindestens 3–6 Monate Runway als Cash vorhalten.</div>'+
  '<h2>Kennzahlen aus dem Abschluss</h2>'+
  '<div class="scr"><table><thead><tr><th>Kennzahl</th><th>Bedeutung</th></tr></thead><tbody>'+
  '<tr><td><strong>EBIT</strong></td><td>Ergebnis vor Zinsen und Steuern — trägt das Geschäft selbst?</td></tr>'+
  '<tr><td><strong>EBITDA</strong></td><td>zusätzlich vor Abschreibungen — Näherung an den operativen Cashflow</td></tr>'+
  '<tr><td><strong>Gross Profit</strong></td><td>Umsatz minus direkte Kosten</td></tr>'+
  '<tr><td><strong>Gross Margin</strong></td><td>Gross Profit ÷ Umsatz — bei SaaS die zentrale Qualitätskennzahl</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Fristen für den Jahresabschluss (GmbH)</h2>'+
  '<ol><li><strong>Aufstellung</strong> bis 3 Monate nach Geschäftsjahresende → bei 31.12.: <strong>bis 31.03.</strong></li>'+
  '<li><strong>Feststellung</strong> durch die Gesellschafterversammlung innerhalb 8 Monaten → <strong>bis 31.08.</strong></li>'+
  '<li><strong>Offenlegung</strong> im Bundesanzeiger innerhalb 12 Monaten → <strong>bis 31.12.</strong></li></ol>'+
  '<div class="hint hint--alert"><b>Bei Verspätung:</b> Ordnungsgeld 2.500–25.000 €, Veröffentlichung der Säumnis im Bundesanzeiger, <b>Geschäftsführer persönlich haftbar</b>, bei Insolvenz Verdacht auf Insolvenzverschleppung. Steuerberatung mindestens 6 Monate vorher beauftragen.</div>'+
  '<h2>Die sieben goldenen Regeln</h2>'+
  '<ol><li><strong>Privat und geschäftlich strikt trennen.</strong> Eigenes Geschäftskonto ist Pflicht, private Ausgaben niemals über das Firmenkonto.</li>'+
  '<li><strong>Belege sofort digitalisieren.</strong> Foto mit App ist rechtssicher — kein Papierstapel.</li>'+
  '<li><strong>Monatliches Controlling.</strong> GuV und Cashflow monatlich ansehen, nicht erst beim Jahresabschluss.</li>'+
  '<li><strong>Steuerberatung früh einbinden.</strong> Kostet grob 3.000 €/Jahr, spart durch Optimierung meist ein Mehrfaches.</li>'+
  '<li><strong>10 Jahre aufbewahren.</strong> Alle Belege, Rechnungen, Verträge.</li>'+
  '<li><strong>Automatisieren.</strong> Banking-Import, OCR und Schnittstellen reduzieren den Aufwand drastisch.</li>'+
  '<li><strong>Cashflow ist König.</strong> Gewinn ist schön, Cashflow hält dich am Leben.</li></ol>'+
  '<h2>Checkliste</h2>'+
  '<p><strong>Vor Gründung:</strong></p>'+
  '<ul class="check"><li>Geschäftskonto eröffnen</li><li>Buchhaltungssoftware wählen</li><li>Steuerberatung suchen</li></ul>'+
  '<p><strong>Laufend, monatlich:</strong></p>'+
  '<ul class="check"><li>Belege digitalisieren</li><li>Banking abstimmen</li><li>USt-Voranmeldung</li><li>GuV und Cashflow reviewen</li></ul>'+
  '<p><strong>Jährlich:</strong></p>'+
  '<ul class="check"><li>Jahresabschluss (bis 31.03.)</li><li>Inventur bei doppelter Buchführung</li><li>Feststellung und Offenlegung</li></ul>'+
  '<h2>Rechnungspflichtangaben (§ 14 UStG)</h2>'+
  '<p>Vollständige Namen und Adressen beider Seiten, Steuernummer oder USt-IdNr., Rechnungsdatum, fortlaufende Nummer, Leistungsbeschreibung und Zeitpunkt, Netto, Steuersatz, Steuerbetrag. Im B2B-Bereich gilt in Deutschland die Umstellung auf strukturierte <strong>E-Rechnungen</strong> mit gestaffelten Fristen — empfangen können musst du sie bereits.</p>' });

A({ id:'behoerden', t:'Behörden & Anmeldeprozesse', sub:'Wer was von dir will — und in welcher Reihenfolge', html:
  '<p>Die Bürokratie ist weniger schlimm als ihr Ruf, wenn man die Reihenfolge kennt. Realistisch dauert die Gründung einer UG oder GmbH <strong>vier bis acht Wochen</strong>, wobei das Handelsregister der Flaschenhals ist.</p>'+
  '<h2>Die Reihenfolge</h2>'+
  '<div class="scr"><table><thead><tr><th>#</th><th>Stelle</th><th>Was</th><th>Kosten</th></tr></thead><tbody>'+
  '<tr><td>1</td><td><strong>Notar</strong></td><td>Beurkundung Gesellschaftsvertrag, Geschäftsführerbestellung</td><td>~300–900 €</td></tr>'+
  '<tr><td>2</td><td><strong>Bank</strong></td><td>Geschäftskonto auf die Gesellschaft i.&nbsp;G., Stammkapital einzahlen</td><td>0–20 €/Monat</td></tr>'+
  '<tr><td>3</td><td><strong>Amtsgericht / Handelsregister</strong></td><td>Eintragung — beantragt der Notar</td><td>~150–250 €</td></tr>'+
  '<tr><td>4</td><td><strong>Gewerbeamt</strong></td><td>Gewerbeanmeldung der Sitzgemeinde</td><td>~20–60 €</td></tr>'+
  '<tr><td>5</td><td><strong>Finanzamt</strong></td><td>Fragebogen zur steuerlichen Erfassung über ELSTER</td><td>—</td></tr>'+
  '<tr><td>6</td><td><strong>IHK / HWK</strong></td><td>Mitgliedschaft entsteht automatisch</td><td>oft erste Jahre reduziert</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Nur mit Personal</h2>'+
  '<ul><li><strong>Bundesagentur für Arbeit</strong> — Betriebsnummer beantragen, bevor die erste Lohnabrechnung läuft</li>'+
  '<li><strong>Krankenkassen</strong> — Anmeldung jedes Beschäftigten über das Meldeverfahren</li>'+
  '<li><strong>Berufsgenossenschaft</strong> — gesetzliche Unfallversicherung, Anmeldung ist Pflicht</li>'+
  '<li><strong>Minijob-Zentrale</strong> — bei geringfügig Beschäftigten</li></ul>'+
  '<h2>Was aus dem Finanzamt-Fragebogen entsteht</h2>'+
  '<ul><li><strong>Steuernummer</strong> — ohne die kannst du keine korrekte Rechnung stellen</li>'+
  '<li><strong>USt-IdNr.</strong> auf Antrag — nötig für EU-Geschäfte</li>'+
  '<li>Entscheidung über die <strong>Kleinunternehmerregelung</strong></li>'+
  '<li>Der <strong>Voranmeldungsrhythmus</strong> für die Umsatzsteuer</li></ul>'+
  '<div class="hint"><b>Das ist der Punkt mit der größten Hebelwirkung.</b> Der Fragebogen enthält Wahlrechte, die dich ein Jahr binden. Deshalb: Steuerberatung <em>vor</em> dem Ausfüllen, nicht danach.</div>'+
  '<h2>Website-Pflichten</h2>'+
  '<ul><li><strong>Impressum</strong> nach § 5 DDG: Name, Anschrift, Vertretung, Kontakt, Register und Registernummer, USt-IdNr.</li>'+
  '<li><strong>Datenschutzerklärung</strong> nach Art. 13 DSGVO, passend zu den tatsächlich eingesetzten Tools</li>'+
  '<li><strong>Cookie-Einwilligung</strong> vor dem Setzen nicht notwendiger Cookies — Analytics eingeschlossen</li></ul>'+
  '<h2>Wenn Genehmigungen dazukommen</h2>'+
  '<p>Manche Tätigkeiten sind erlaubnispflichtig: Gastronomie, Handwerk mit Meisterpflicht, Finanz- und Versicherungsvermittlung, Personenbeförderung, Medizinprodukte, Lebensmittel. Vor dem Businessplan klären — nicht nach der ersten Rechnung.</p>' });

A({ id:'kpis', t:'Finanzkennzahlen & KPIs', sub:'Burn, Runway, ARR, CAC, LTV, Churn, NRR', html:
  '<p>Vanity Metrics sehen im Deck gut aus und sagen nichts: Registrierungen, Seitenaufrufe, Follower, Downloads. Sie steigen immer, auch wenn das Produkt nicht funktioniert.</p>'+
  '<h2>Überlebenskennzahlen</h2>'+
  '<div class="scr"><table><thead><tr><th>Kennzahl</th><th>Formel</th><th>Orientierung</th></tr></thead><tbody>'+
  '<tr><td><strong>Burn Rate</strong></td><td>Ausgaben − Einnahmen pro Monat</td><td>kennen, nicht schätzen</td></tr>'+
  '<tr><td><strong>Runway</strong></td><td>Kontostand ÷ Burn Rate</td><td>&gt; 12 Monate, Ziel 18</td></tr>'+
  '<tr><td><strong>Break-Even</strong></td><td>Fixkosten ÷ Deckungsbeitrag pro Einheit</td><td>Datum benennen können</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Umsatzkennzahlen</h2>'+
  '<div class="scr"><table><thead><tr><th>Kennzahl</th><th>Bedeutung</th></tr></thead><tbody>'+
  '<tr><td><strong>MRR</strong></td><td>Monthly Recurring Revenue — wiederkehrender Monatsumsatz</td></tr>'+
  '<tr><td><strong>ARR</strong></td><td>MRR × 12 — nur bei echten Abos sinnvoll</td></tr>'+
  '<tr><td><strong>ARPU</strong></td><td>Umsatz ÷ Anzahl Kund:innen</td></tr>'+
  '<tr><td><strong>Churn</strong></td><td>Anteil der Kund:innen (oder des Umsatzes), der pro Monat wegfällt</td></tr>'+
  '<tr><td><strong>NRR</strong></td><td>Net Revenue Retention: Umsatz der Bestandskunden inkl. Upgrades ÷ Vorjahr. &gt; 100 % heißt: du wächst auch ohne Neukunden</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Unit Economics</h2>'+
  '<ul><li><strong>CAC</strong> — alle Marketing- und Vertriebskosten ÷ neu gewonnene <em>zahlende</em> Kund:innen. Nicht nur Werbebudget.</li>'+
  '<li><strong>LTV</strong> — Deckungsbeitrag über die gesamte Kundenbeziehung. Näherung: ARPU × Bruttomarge ÷ Churn.</li>'+
  '<li><strong>LTV/CAC</strong> — über 3 gilt als tragfähig.</li>'+
  '<li><strong>CAC Payback</strong> — nach wie vielen Monaten der Kunde die Akquisekosten zurückgezahlt hat. Unter 12 Monaten ist gut.</li></ul>'+
  '<div class="hint"><b>In der Frühphase sind LTV und CAC unzuverlässig</b>, weil sie auf wenigen Datenpunkten stehen. Im Pitch ist "zu früh für belastbare Unit Economics" stärker als eine ausgedachte Zahl.</div>'+
  '<h2>Was in der Frühphase wirklich zählt</h2>'+
  '<ul><li><strong>Aktivierung</strong> — Anteil, der den ersten echten Nutzen erlebt</li>'+
  '<li><strong>Retention</strong> — Anteil, der nach Woche 1 / 4 / 8 zurückkommt. Die wichtigste Kurve überhaupt: es wächst nur, was bleibt.</li></ul>'+
  '<div class="hint hint--ok"><b>Zwei Metriken reichen.</b> Eine für Aktivierung, eine für Retention. Wöchentlich, an derselben Stelle, mit derselben Definition. Die Kurve über zwölf Wochen überzeugt mehr als jeder absolute Wert.</div>' });

A({ id:'planning', t:'Financial Planning & Forecasting', sub:'Budget, Liquidität, Break-Even, Szenarien', html:
  '<p>Ein Finanzplan sagt nicht die Zukunft voraus. Er beantwortet drei Fragen: <strong>Wie viel Geld brauche ich, wann geht es aus, und welche Annahme muss stimmen?</strong></p>'+
  '<h2>Der Aufbau</h2>'+
  '<ol><li><strong>Umsatzplan</strong> — bottom-up aus Anzahl Kund:innen × Preis × Frequenz. Nie ein Prozentwachstum auf eine Fantasiebasis.</li>'+
  '<li><strong>Personalplan</strong> — die größte Kostenposition. Mit Arbeitgeberanteil rechnen: grob Bruttogehalt × 1,21.</li>'+
  '<li><strong>Sonstige Kosten</strong> — Tools, Miete, Marketing, Beratung, Versicherungen.</li>'+
  '<li><strong>Investitionen</strong> — Hardware, Entwicklung, Patente. Mit Abschreibung, nicht als Einmalkosten.</li>'+
  '<li><strong>Liquiditätsplan</strong> — monatlich, mit Zahlungszeitpunkten statt Rechnungsdaten.</li></ol>'+
  '<div class="hint hint--alert"><b>Der Unterschied, der Firmen tötet:</b> Der Umsatzplan sagt, wann du eine Rechnung <em>stellst</em>. Der Liquiditätsplan sagt, wann das Geld <em>ankommt</em>. Bei 30–60 Tagen Zahlungsziel liegen dazwischen zwei Monate, in denen Gehälter trotzdem fällig sind.</div>'+
  '<h2>Drei Szenarien statt einer Zahl</h2>'+
  '<div class="scr"><table><thead><tr><th>Szenario</th><th>Annahme</th><th>Wofür</th></tr></thead><tbody>'+
  '<tr><td><strong>Base</strong></td><td>realistisch, was ihr euch zutraut</td><td>der Plan, an dem ihr arbeitet</td></tr>'+
  '<tr><td><strong>Downside</strong></td><td>halber Umsatz, gleiche Kosten</td><td>wann müsst ihr reagieren</td></tr>'+
  '<tr><td><strong>Upside</strong></td><td>Vertrieb funktioniert besser</td><td>wann könnt ihr einstellen</td></tr>'+
  '</tbody></table></div>'+
  '<p>Investor:innen interessieren sich weniger für die Zahlen als für die <strong>Annahmen dahinter</strong> und dafür, ob ihr wisst, welche davon kritisch ist.</p>'+
  '<h2>Break-Even</h2>'+
  '<p>Fixkosten ÷ Deckungsbeitrag pro Einheit = nötige Stückzahl. Beispiel: 20.000 € Fixkosten pro Monat, 50 € Deckungsbeitrag pro Kunde → <strong>400 Kund:innen</strong>. Diese Zahl ist oft aufschlussreicher als jede Umsatzprognose.</p>'+
  '<h2>Monatliches Ritual</h2>'+
  '<ul><li><strong>Plan gegen Ist</strong> — nicht um sich zu rechtfertigen, sondern um Annahmen zu korrigieren</li>'+
  '<li><strong>Runway neu rechnen</strong> — bei jeder größeren Ausgabenentscheidung</li>'+
  '<li><strong>Forderungen prüfen</strong> — wer zahlt nicht? Mahnwesen ist Cashflow-Management</li>'+
  '<li><strong>13-Wochen-Liquidität</strong> — bei knapper Kasse wöchentlich statt monatlich planen</li></ul>' });

A({ id:'vertragsrecht', t:'Sales & Vertragsrecht', sub:'NDA, LOI, MSA, SOW, SLA — und die roten Flaggen', html:
  '<p>Verträge sind die Grundlage deines Business. Ein schlechter Vertrag kann dich Jahre binden, ein guter schützt dich und ermöglicht Wachstum.</p>'+
  '<h2>Übersicht: B2B-Vertragstypen</h2>'+
  '<div class="scr"><table><thead><tr><th>Typ</th><th>Zweck</th><th>Wann</th><th>Komplexität</th></tr></thead><tbody>'+
  '<tr><td><strong>NDA</strong></td><td>Vertraulichkeit schützen</td><td>vor Gesprächen über sensible Daten</td><td>einfach</td></tr>'+
  '<tr><td><strong>LOI / Term Sheet</strong></td><td>Absichtserklärung</td><td>nach Verhandlung, vor finalem Vertrag</td><td>mittel</td></tr>'+
  '<tr><td><strong>MSA</strong></td><td>Rahmenvertrag für langfristige Zusammenarbeit</td><td>mehrere Projekte, gleicher Kunde</td><td>komplex</td></tr>'+
  '<tr><td><strong>SOW</strong></td><td>konkrete Projektbeschreibung</td><td>Einzelprojekt unter einem MSA</td><td>mittel</td></tr>'+
  '<tr><td><strong>SLA</strong></td><td>Service-Qualität garantieren</td><td>Teil des Hauptvertrags (MSA/SaaS)</td><td>mittel</td></tr>'+
  '<tr><td><strong>Order Form</strong></td><td>einfache Bestellung</td><td>Standardprodukte, SaaS-Abos</td><td>einfach</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Was in einen MSA gehört</h2>'+
  '<ol><li>Leistungsumfang (Scope)</li><li>Vergütung und Zahlungsbedingungen</li><li>Laufzeit und Kündigung</li>'+
  '<li>Gewährleistung und Haftung</li><li>IP-Rechte</li><li>Höhere Gewalt (Force Majeure)</li>'+
  '<li>Rechtswahl und Gerichtsstand</li></ol>'+
  '<p>Struktur in der Praxis: <strong>MSA</strong> regelt die Rahmenbedingungen einmal, <strong>SOWs</strong> beschreiben die einzelnen Projekte — Scope, Deliverables, Acceptance Criteria, Pricing, Change-Request-Prozess.</p>'+
  '<h2>SLA — typische Metriken</h2>'+
  '<ul><li><strong>Uptime</strong> (z.&nbsp;B. 99,9&nbsp;%)</li><li><strong>Response &amp; Resolution Time</strong> (z.&nbsp;B. 1&nbsp;h bei Critical)</li>'+
  '<li><strong>Service Credits</strong> als Kompensation bei Nicht-Einhaltung</li><li><strong>Monitoring und Transparenz</strong></li></ul>'+
  '<p>Ein SLA ohne Service Credits ist Marketing, keine Zusage.</p>'+
  '<h2>Rote Flaggen in Verträgen</h2>'+
  '<div class="scr"><table><thead><tr><th>Red Flag</th><th>Gefahr</th><th>Lösung</th></tr></thead><tbody>'+
  '<tr><td>Unlimitierte Haftung</td><td>ein Bug kostet dich Millionen</td><td><strong>Cap auf 1× Jahresgebühr</strong></td></tr>'+
  '<tr><td>Einseitige Kündigung</td><td>keine Planungssicherheit</td><td>beidseitige Kündigungsfristen</td></tr>'+
  '<tr><td>Auto-Renewal über 3 Jahre</td><td>Kunde zahlt ungewollt weiter</td><td>maximal 1 Jahr Auto-Renewal</td></tr>'+
  '<tr><td>Unbegrenzte Gewährleistung</td><td>unmöglich zu erfüllen</td><td>30–90 Tage Gewährleistung</td></tr>'+
  '<tr><td>Keine Exit-Klausel</td><td>an insolventen Partner gebunden</td><td>Termination bei Material Breach</td></tr>'+
  '<tr><td>Zahlungsziel 90+ Tage</td><td>Cashflow-Risiko</td><td>max. 30 Tage, besser 14</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Typische Fallen</h2>'+
  '<ul><li><strong>Auto-Renewal ohne Reminder</strong> → Kalendererinnerung 6 Monate vor der Kündigungsfrist</li>'+
  '<li><strong>IP-Rechte unklar</strong> → explizit regeln: Background IP bleibt beim Eigentümer, Foreground IP geht typischerweise an den Kunden</li>'+
  '<li><strong>Kein Change-Request-Prozess</strong> → CR-Prozess im SOW definieren, sonst Scope Creep ohne Bezahlung</li>'+
  '<li><strong>Keine Force Majeure</strong> → bei Pandemie oder Krieg haftest du für Nicht-Lieferung</li></ul>'+
  '<h2>Internationale Verträge</h2>'+
  '<p><strong>Rechtswahl:</strong> Deutsches Recht ist dein Heimvorteil, das Recht des Kunden bedeutet teure Einarbeitung, neutrales Recht (UK, Schweiz) ist Kompromiss für beide. Das <strong>UN-Kaufrecht (CISG) sollte immer ausgeschlossen werden</strong>.</p>'+
  '<p><strong>Streitbeilegung:</strong> Ordentliche Gerichte sind günstiger, aber öffentlich und langsam (1–3 Jahre). Ein Schiedsgericht ist schneller (6–12 Monate), vertraulich und international anerkannt — aber teuer (20–100 T€).</p>'+
  '<h2>Checkliste vor Vertragsabschluss</h2>'+
  '<ul class="check"><li>Vertragspartner recherchiert (Bonität, Reputation)</li><li>NDA unterschrieben</li>'+
  '<li>Preise klar definiert</li><li>Laufzeit und Kündigung geregelt</li><li>Haftung limitiert</li>'+
  '<li>IP-Rechte geklärt — wer besitzt was</li><li>Rechtswahl und Gerichtsstand akzeptabel</li>'+
  '<li>Zahlungsbedingungen realistisch für den Cashflow</li><li>Anwalt geprüft (bei Deals über 50 T€)</li></ul>'+
  '<h2>Nach Abschluss</h2>'+
  '<ul class="check"><li>Von beiden Seiten unterschrieben</li><li>Kopie sicher aufbewahrt (Cloud + lokal)</li>'+
  '<li>Fristen im Kalender (Kündigung, Renewal)</li><li>Team informiert (Sales, Legal, Finance)</li>'+
  '<li>Compliance-Check: wird der Vertrag eingehalten</li></ul>'+
  '<div class="hint hint--ok"><b>Goldene Regel.</b> Lies den Vertrag selbst — auch wenn eine Kanzlei ihn geprüft hat. <b>Du</b> musst damit leben, nicht der Anwalt. Wenn du eine Klausel nicht verstehst, frag nach. Wenn dir eine Klausel komisch vorkommt, ist sie es wahrscheinlich auch.</div>'+
  '<h2>Was wann kostet (Orientierung)</h2>'+
  '<ul><li>Eigene AGB erstellen lassen: 0–1.500 €</li>'+
  '<li>Terms of Service für SaaS: 1.500–3.000 €</li>'+
  '<li>MSA-Template: 3.000–10.000 €</li>'+
  '<li>Kanzlei mit Retainer bei Enterprise-Sales: 2.000–5.000 €/Monat</li></ul>'+
  '<p>Kostenlose Musterverträge gibt es bei IHK und DIHK, Startup-Ressourcen beim Bundesverband Deutsche Startups. Für Signatur und Vertragsverwaltung sind DocuSign, PandaDoc, Contractbook, Ironclad und Juro verbreitet.</p>' });

A({ id:'hr', t:'People & HR', sub:'Verträge, Beteiligung, Scheinselbstständigkeit', html:
  '<p>Die erste Einstellung ist der Moment, in dem aus einem Projekt ein Arbeitgeber wird — mit Melde-, Abführungs- und Fürsorgepflichten.</p>'+
  '<h2>Beschäftigungsformen</h2>'+
  '<div class="scr"><table><thead><tr><th>Form</th><th>Worauf achten</th></tr></thead><tbody>'+
  '<tr><td><strong>Minijob</strong></td><td>Verdienstgrenze ist an den Mindestlohn gekoppelt und steigt jährlich — aktuellen Wert prüfen; Anmeldung bei der Minijob-Zentrale</td></tr>'+
  '<tr><td><strong>Werkstudent:in</strong></td><td>im Semester höchstens 20 h/Woche, dann nur Rentenversicherungsbeiträge; Immatrikulationsnachweis</td></tr>'+
  '<tr><td><strong>Praktikant:in</strong></td><td>Pflichtpraktikum vs. freiwillig entscheidet über Mindestlohn und Versicherungspflicht</td></tr>'+
  '<tr><td><strong>Freelancer:in</strong></td><td>echte Selbstständigkeit sicherstellen, Rechteübertragung schriftlich regeln</td></tr>'+
  '<tr><td><strong>Festanstellung</strong></td><td>Probezeit, Kündigungsfristen, Urlaub, Arbeitszeiterfassung</td></tr>'+
  '</tbody></table></div>'+
  '<div class="hint hint--alert"><b>Scheinselbstständigkeit.</b> Wer wie ein Angestellter arbeitet — feste Zeiten, Weisungen, nur ein Auftraggeber, kein eigenes Auftreten am Markt — ist rechtlich angestellt, egal was im Vertrag steht. Die Nachforderung von Sozialabgaben trifft rückwirkend das Unternehmen. Bei Unsicherheit: Statusfeststellungsverfahren der Deutschen Rentenversicherung.</div>'+
  '<h2>Was ein Gehalt wirklich kostet</h2>'+
  '<p>Zum Bruttogehalt kommt der Arbeitgeberanteil zur Sozialversicherung: grob <strong>Brutto × 1,21</strong> als Daumenregel für die Planung. Dazu Urlaub, Krankheit, Ausstattung und Recruiting-Kosten.</p>'+
  '<h2>Mitarbeiterbeteiligung: ESOP vs. VSOP</h2>'+
  '<div class="scr"><table><thead><tr><th></th><th>ESOP</th><th>VSOP</th></tr></thead><tbody>'+
  '<tr><th>Was</th><td>echte Optionen auf echte Anteile</td><td>virtuelle Anteile, rein vertraglich</td></tr>'+
  '<tr><th>Notar nötig</th><td>ja, bei Ausübung</td><td>nein</td></tr>'+
  '<tr><th>Steuer</th><td>Risiko der Besteuerung schon bei Gewährung</td><td>Besteuerung erst bei Auszahlung, als Arbeitslohn</td></tr>'+
  '<tr><th>In Deutschland</th><td>seltener</td><td><strong>Standard</strong></td></tr>'+
  '</tbody></table></div>'+
  '<p>Typische Konditionen: Pool 10–15&nbsp;%, Vesting 4 Jahre mit 1 Jahr Cliff, Auszahlung im Exit-Fall. Wichtig ist eine verständliche Erklärung für die Mitarbeitenden — ein Beteiligungsprogramm, das niemand versteht, motiviert nicht.</p>'+
  '<h2>Recruiting in der Frühphase</h2>'+
  '<ul><li><strong>Erste Hires über das eigene Netzwerk</strong> — Reichweite hast du noch nicht, Vertrauen schon</li>'+
  '<li><strong>Rollen statt Titel</strong> — beschreibe die ersten sechs Monate konkret, nicht die Karriereleiter</li>'+
  '<li><strong>Probeaufgabe bezahlen</strong> — 4–8 Stunden, echtes Problem, kein Gratis-Projekt</li>'+
  '<li><strong>Onboarding vorbereiten</strong> — Zugänge, erste Aufgabe, Ansprechperson am ersten Tag</li></ul>'+
  '<h2>Pflichten, die gern vergessen werden</h2>'+
  '<ul><li><strong>Arbeitszeiterfassung</strong> — in Deutschland grundsätzlich verpflichtend</li>'+
  '<li><strong>Berufsgenossenschaft</strong> anmelden</li>'+
  '<li><strong>Betriebsnummer</strong> bei der Bundesagentur für Arbeit</li>'+
  '<li><strong>Datenschutz für Bewerberdaten</strong> — Löschfristen einhalten</li>'+
  '<li><strong>Gleichbehandlung (AGG)</strong> — schon in der Stellenausschreibung</li></ul>' });

A({ id:'datenschutz', t:'Datenschutz & Compliance', sub:'DSGVO, AVV, TOMs, Datenpannen', html:
  '<p>DSGVO betrifft dich ab dem ersten Newsletter und dem ersten Kontaktformular. Der Aufwand ist überschaubar, wenn man ihn früh erledigt — und teuer, wenn eine Aufsichtsbehörde oder ein Kunde nachfragt.</p>'+
  '<h2>Die Grundlagen</h2>'+
  '<ul><li><strong>Rechtsgrundlage</strong> für jede Verarbeitung: Vertrag, Einwilligung, berechtigtes Interesse oder gesetzliche Pflicht</li>'+
  '<li><strong>Datenminimierung</strong> — nur erheben, was gebraucht wird</li>'+
  '<li><strong>Zweckbindung</strong> — nicht für etwas anderes weiterverwenden</li>'+
  '<li><strong>Löschfristen</strong> definieren und einhalten</li>'+
  '<li><strong>Transparenz</strong> — Datenschutzerklärung nach Art. 13</li></ul>'+
  '<h2>Die Pflichtdokumente</h2>'+
  '<div class="scr"><table><thead><tr><th>Dokument</th><th>Wofür</th></tr></thead><tbody>'+
  '<tr><td><strong>Datenschutzerklärung</strong></td><td>auf der Website, passend zu den real eingesetzten Tools</td></tr>'+
  '<tr><td><strong>Verzeichnis von Verarbeitungstätigkeiten (VVT)</strong></td><td>interne Übersicht aller Verarbeitungen — auch kleine Teams brauchen es</td></tr>'+
  '<tr><td><strong>AVV</strong></td><td>Auftragsverarbeitungsvertrag mit jedem Dienstleister, der personenbezogene Daten verarbeitet</td></tr>'+
  '<tr><td><strong>TOMs</strong></td><td>technische und organisatorische Maßnahmen: Verschlüsselung, Zugriffskonzept, Backups</td></tr>'+
  '<tr><td><strong>Löschkonzept</strong></td><td>welche Daten wann gelöscht werden</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Betroffenenrechte</h2>'+
  '<p>Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch. Frist: <strong>ein Monat</strong>. Praktisch heißt das: Du musst wissen, wo die Daten einer Person liegen, und sie herausgeben oder löschen können.</p>'+
  '<div class="hint hint--alert"><b>Datenpanne: 72 Stunden.</b> Eine Verletzung des Schutzes personenbezogener Daten muss der zuständigen Aufsichtsbehörde binnen 72 Stunden gemeldet werden — bei hohem Risiko zusätzlich den Betroffenen. Deshalb: Meldeprozess und Ansprechperson vorher festlegen, nicht im Ernstfall improvisieren.</div>'+
  '<h2>Cookies und Tracking</h2>'+
  '<p>Einwilligung <strong>vor</strong> dem Setzen nicht notwendiger Cookies — Analytics und Marketing-Pixel eingeschlossen. Ein Banner, das nur "OK" anbietet, genügt nicht: Ablehnen muss gleich einfach sein.</p>'+
  '<h2>Datenübermittlung außerhalb der EU</h2>'+
  '<p>Bei US-Diensten: Prüfen, ob der Anbieter über einen Angemessenheitsbeschluss abgedeckt ist, sonst Standardvertragsklauseln plus Risikoabschätzung. Praktisch bedeutet das eine Liste aller eingesetzten Tools mit Serverstandort — die brauchst du für Enterprise-Kunden ohnehin.</p>'+
  '<h2>Datenschutzbeauftragte:r</h2>'+
  '<p>Pflicht, sobald in der Regel mindestens 20 Personen ständig mit automatisierter Verarbeitung personenbezogener Daten beschäftigt sind — oder bei besonders risikoreichen Verarbeitungen. Kann intern benannt oder extern beauftragt werden.</p>'+
  '<h2>Was Enterprise-Kunden fragen</h2>'+
  '<ul><li>AVV-Vorlage vorhanden?</li><li>Liste der Subunternehmer mit Serverstandort?</li>'+
  '<li>TOMs dokumentiert?</li><li>Zertifizierungen (ISO 27001, SOC 2) — oft optional, aber verkaufsentscheidend</li>'+
  '<li>Löschkonzept und Exportmöglichkeit?</li></ul>'+
  '<div class="hint"><b>Reihenfolge:</b> Datenschutzerklärung und AVVs zuerst, dann VVT und TOMs, Zertifizierungen erst wenn ein Kunde sie verlangt. Generatoren sind ein Startpunkt, keine Prüfung. Keine Rechtsberatung.</div>' });

A({ id:'international', t:'Internationalisierung & Export', sub:'EU-VAT, OSS, Strukturen, Go-to-Market', html:
  '<p>Der zweite Markt ist selten eine Kopie des ersten. Vor dem Schritt ins Ausland lohnt die harte Frage: <strong>Trägt der Heimatmarkt schon, oder flüchtest du vor einem Vertriebsproblem?</strong></p>'+
  '<h2>Umsatzsteuer im EU-Geschäft</h2>'+
  '<div class="scr"><table><thead><tr><th>Konstellation</th><th>Regel</th></tr></thead><tbody>'+
  '<tr><td><strong>B2B in der EU</strong></td><td>Reverse Charge: Kunde schuldet die USt. Beide USt-IdNr. prüfen und auf der Rechnung nennen</td></tr>'+
  '<tr><td><strong>B2C digital in der EU</strong></td><td>USt am Wohnsitz des Kunden — Abwicklung über <strong>OSS</strong> (One-Stop-Shop) statt Registrierung in jedem Land</td></tr>'+
  '<tr><td><strong>Waren in Drittland</strong></td><td>Ausfuhrlieferung, meist steuerfrei — Nachweise aufbewahren</td></tr>'+
  '<tr><td><strong>Leistungen ins Drittland</strong></td><td>Ortsbestimmung im Einzelfall prüfen</td></tr>'+
  '</tbody></table></div>'+
  '<p>Die EU-Kleinunternehmerschwelle für Fernverkäufe liegt bei <strong>10.000 €</strong> Jahresumsatz über alle EU-Länder — darunter darf weiter im Heimatland versteuert werden, darüber gilt das Bestimmungsland.</p>'+
  '<h2>Strukturen</h2>'+
  '<ul><li><strong>Direktvertrieb aus Deutschland</strong> — einfachster Start, keine neue Gesellschaft</li>'+
  '<li><strong>Handelsvertreter oder Distributor</strong> — schnell, aber du verlierst Kundennähe; Ausgleichsansprüche beachten</li>'+
  '<li><strong>Betriebsstätte</strong> — entsteht schnell unbeabsichtigt (Büro, festes Personal) und löst Steuerpflicht im Ausland aus</li>'+
  '<li><strong>Tochtergesellschaft</strong> — sauber, aber Buchhaltung, Abschluss und Compliance verdoppeln sich</li></ul>'+
  '<div class="hint hint--alert"><b>Transfer Pricing.</b> Sobald zwei verbundene Gesellschaften einander Leistungen berechnen, müssen die Preise fremdvergleichsüblich sein und dokumentiert werden. Wird das versäumt, schätzt die Finanzverwaltung — regelmäßig zu deinen Ungunsten.</div>'+
  '<h2>Menschen über Grenzen</h2>'+
  '<ul><li><strong>A1-Bescheinigung</strong> für Dienstreisen und Entsendungen innerhalb der EU</li>'+
  '<li><strong>Blaue Karte EU</strong> für qualifizierte Fachkräfte aus Drittstaaten</li>'+
  '<li><strong>Remote-Anstellung im Ausland</strong> — löst häufig lokale Lohnsteuer- und Sozialversicherungspflichten aus; Employer of Record ist der pragmatische Weg</li></ul>'+
  '<h2>Go-to-Market im neuen Markt</h2>'+
  '<ol><li><strong>Einen</strong> Markt wählen, nicht drei. Kriterien: Marktgröße, Sprache, Kaufverhalten, regulatorischer Aufwand.</li>'+
  '<li>Fünf bis zehn Kundeninterviews <em>im Zielmarkt</em> — Annahmen aus dem Heimatmarkt übertragen sich selten.</li>'+
  '<li>Lokalisierung heißt mehr als Übersetzung: Preise, Zahlungsarten, Rechnungsformate, Support-Zeiten.</li>'+
  '<li>Erst nach ersten Referenzkunden über eine lokale Gesellschaft nachdenken.</li></ol>'+
  '<p>Für Exportberatung sind IHK und AHK die naheliegenden Adressen, für EU-Programme die entsprechenden Förderportale.</p>' });

A({ id:'ip', t:'Intellectual Property & Patente', sub:'Marke, Patent, Trade Secrets, Open Source', html:
  '<h2>Marke</h2>'+
  '<p>Anmeldung beim <strong>DPMA</strong>: elektronisch 290 € für bis zu drei Klassen, jede weitere Klasse 100 €, Schutzdauer zehn Jahre und verlängerbar. EU-weiter Schutz läuft als Unionsmarke über das EUIPO.</p>'+
  '<p>Vorher immer selbst recherchieren — im DPMAregister und im EUIPO-Register. Eine Kollision nach dem Rebranding ist teuer, und das DPMA prüft <strong>nicht</strong>, ob älteren Rechte bestehen: Widerspruch kommt vom Markeninhaber, nicht vom Amt.</p>'+
  '<h2>Patent oder besser nicht</h2>'+
  '<p>Relevant bei technischen Erfindungen, nicht bei Software-Features oder Geschäftsmodellen. Drei Dinge entscheiden:</p>'+
  '<ul><li><strong>Neuheit</strong> — wer die Erfindung vorher öffentlich zeigt, verliert die Patentierbarkeit. Also erst prüfen, dann pitchen.</li>'+
  '<li><strong>Erfinderische Tätigkeit</strong> — nicht naheliegend für Fachleute.</li>'+
  '<li><strong>Gewerbliche Anwendbarkeit.</strong></li></ul>'+
  '<p>Kosten realistisch: Anmeldung in Deutschland mit Patentanwalt 5.000–10.000 €, internationale Ausweitung (PCT) ein Mehrfaches. Ein Patent ist eine Investition in Verhandlungsmacht, keine Trophäe.</p>'+
  '<div class="hint"><b>Alternative:</b> <b>Trade Secret</b> — Geheimhaltung statt Offenlegung. Nach dem Geschäftsgeheimnisgesetz nur geschützt, wenn du <em>angemessene Geheimhaltungsmaßnahmen</em> nachweisen kannst: Zugriffsbeschränkungen, NDAs, Kennzeichnung, dokumentierte Prozesse.</div>'+
  '<h2>Urheberrecht und Code</h2>'+
  '<p>Code, Texte, Designs und Fotos sind automatisch urheberrechtlich geschützt — aber der Schutz liegt beim <strong>Urheber</strong>, nicht bei der Gesellschaft. Bei Angestellten geht das Nutzungsrecht meist über den Arbeitsvertrag über; bei <strong>Freelancern nur, wenn es im Vertrag steht</strong>. Genau das ist der häufigste Fund in der Due Diligence.</p>'+
  '<h2>Open-Source-Lizenzen</h2>'+
  '<div class="scr"><table><thead><tr><th>Typ</th><th>Beispiele</th><th>Folge für dein Produkt</th></tr></thead><tbody>'+
  '<tr><td><strong>Permissiv</strong></td><td>MIT, Apache 2.0, BSD</td><td>unkritisch, Lizenztext und Hinweise mitliefern</td></tr>'+
  '<tr><td><strong>Schwach copyleft</strong></td><td>LGPL, MPL</td><td>Änderungen an der Bibliothek offenlegen</td></tr>'+
  '<tr><td><strong>Stark copyleft</strong></td><td>GPL, AGPL</td><td>kann dein <em>gesamtes</em> Produkt offenlegungspflichtig machen — AGPL auch bei SaaS</td></tr>'+
  '</tbody></table></div>'+
  '<p>Deshalb: eine Liste aller Abhängigkeiten mit Lizenz führen (SBOM). Bei einer Übernahme wird sie geprüft.</p>'+
  '<h2>IP-Strategie in der Frühphase</h2>'+
  '<ol><li><strong>Namen und Domain früh sichern</strong>, Marke sobald der Name feststeht.</li>'+
  '<li><strong>IP-Übertragung</strong> in jeden Gründer-, Arbeits- und Freelancervertrag.</li>'+
  '<li><strong>Geheimhaltung organisieren</strong> statt alles patentieren.</li>'+
  '<li><strong>Patent nur</strong> bei echtem technischem Kern und wenn Wettbewerber es nachbauen könnten.</li>'+
  '<li><strong>Lizenzliste pflegen</strong>, bevor jemand danach fragt.</li></ol>' });

A({ id:'initiativen', t:'Initiativen & Community', sub:'Deine Home-Base an der Uni', html:
  '<p>Hier fängt für die meisten alles an. Studentische Initiativen sind der günstigste Einstieg ins Ökosystem — egal was du studierst.</p>'+
  '<h2>Warum eine Initiative</h2>'+
  '<div class="scr"><table><thead><tr><th>Was</th><th>Konkret</th></tr></thead><tbody>'+
  '<tr><td><strong>Network</strong></td><td>Gleichgesinnte, Co-Founder und Mentor:innen aus deiner Region</td></tr>'+
  '<tr><td><strong>Learn</strong></td><td>Workshops, Vorträge und Hands-on-Sessions zu allen Gründungsthemen</td></tr>'+
  '<tr><td><strong>Build</strong></td><td>von der Idee zum Prototyp, mit Zugang zu Werkstätten und Ressourcen</td></tr>'+
  '<tr><td><strong>Events</strong></td><td>Hackathons, Pitch-Nights, Meetups, Konferenzen</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Im Rhein-Main-Gebiet</h2>'+
  '<p>An jeder Uni gibt es eine Initiative, die Gründer:innen zusammenbringt:</p>'+
  '<ul><li><strong>Founders Club Frankfurt</strong> — Goethe-Universität</li>'+
  '<li><strong>ECM (Entrepreneurs Club Mainz)</strong> — Johannes Gutenberg-Universität</li>'+
  '<li><strong>LAUNCH Darmstadt</strong> — Darmstadt</li></ul>'+
  '<p>Zusammen tragen sie das gemeinsame Ökosystem, in Partnerschaft mit <strong>Futury</strong>.</p>'+
  '<h2>Was daneben noch trägt</h2>'+
  '<ul><li><strong>Hochschul-Transferstellen</strong> — hier läuft der EXIST-Antrag, hier gibt es Gründungsberatung und oft Räume. An der JGU ist das GUTENBERGinnovate, an der Goethe-Uni der Unibator, an der TU Darmstadt HIGHEST.</li>'+
  '<li><strong>Coworking und Hubs</strong> — TechQuartier und Station Frankfurt, Gutenberg Digital Hub in Mainz, HUB31 in Darmstadt, Digital Hub Worms.</li>'+
  '<li><strong>Landesanlaufstellen</strong> — StartHub Hessen, Startup Office Rheinland-Pfalz.</li>'+
  '<li><strong>Themen-Netzwerke</strong> — AI Hub Frankfurt und Hessian AI, Life-Science-Zentren, House of Energy, ESA BIC für Raumfahrt.</li></ul>'+
  '<div class="hint hint--ok"><b>Nächster Schritt:</b> Besuche ein Event deiner lokalen Initiative und lern das Team kennen. Die meisten haben offene Treffen, zu denen man einfach vorbeikommen kann — und ein persönlicher Kontakt öffnet später mehr Türen als jede Kaltakquise.</div>' });

A({ id:'inkubator', t:'Inkubatoren & Programme', sub:'Wann ein Programm sich lohnt — und wann nicht', html:
  '<h2>Die Formate unterscheiden</h2>'+
  '<div class="scr"><table><thead><tr><th>Format</th><th>Phase</th><th>Was du bekommst</th><th>Preis</th></tr></thead><tbody>'+
  '<tr><td><strong>Hackathon</strong></td><td>keine Idee nötig</td><td>Wochenende, Challenge, Team-Matching</td><td>kostenlos</td></tr>'+
  '<tr><td><strong>Ideation-Programm</strong></td><td>vor der Idee</td><td>Problemsuche, Prototyping, Co-Founder finden</td><td>kostenlos</td></tr>'+
  '<tr><td><strong>Inkubator</strong></td><td>Pre-Seed</td><td>Wochen bis Monate Begleitung, Raum, Mentoring</td><td>meist kostenlos, teils Equity</td></tr>'+
  '<tr><td><strong>Accelerator</strong></td><td>mit Traction</td><td>3–6 Monate, Kapital, Investorennetzwerk</td><td>oft 5–8 % Equity</td></tr>'+
  '<tr><td><strong>Venture Studio</strong></td><td>ab Null</td><td>Team und Kapital vom Studio</td><td>hoher Equity-Anteil</td></tr>'+
  '</tbody></table></div>'+
  '<h2>Beispiel: ein studentischer Regional-Inkubator</h2>'+
  '<p>Der LAUNCH Inkubator im Rhein-Main-Gebiet ist das Joint Venture der Studenteninitiativen aus Frankfurt, Darmstadt und Mainz — <strong>10 Wochen Vollgas, intensives Mentoring</strong>. Typischer Umfang:</p>'+
  '<ul><li>Weekly Workshops zu Product, Tech, Business und Pitch</li>'+
  '<li>1:1-Mentoring mit erfahrenen Gründer:innen und Expert:innen</li>'+
  '<li>Zugang zu Funding und Investorennetzwerk</li>'+
  '<li>Co-Working Space</li>'+
  '<li>Demo Day vor Investor:innen und Corporates</li></ul>'+
  '<p>Zwei Programmschienen: der <strong>Winter Batch</strong> (10 Wochen intensiv, Fokus MVP-Entwicklung und Validierung, Abschluss Demo Day) und die <strong>Summer Labs</strong> (Hackathons und Workshops, Fokus Ideation und Prototyping, Wochenend-Sprints).</p>'+
  '<h2>Wer sich typischerweise bewerben kann</h2>'+
  '<ul><li>Studierende und Alumni aus der Region</li>'+
  '<li>Early-Stage-Teams (Pre-Seed, meist bis maximal ~100 T€ Funding)</li>'+
  '<li>Solo-Founder auf der Suche nach Co-Foundern — <strong>Bewerbung mit oder ohne Idee</strong></li>'+
  '<li>Alle Branchen: Tech, Social Impact, DeepTech, Consumer</li>'+
  '<li>Aktive Studenten-Zugehörigkeit oft nicht erforderlich, <strong>keine Equity</strong></li></ul>'+
  '<h2>Wie ein Bewerbungsprozess abläuft</h2>'+
  '<ol><li><strong>Online-Bewerbung</strong> — Pitch Deck oder Lean Canvas, oft ein 2-Minuten-Video</li>'+
  '<li><strong>Interview</strong> (ca. 30 Minuten) — Team-Fit und Vision</li>'+
  '<li><strong>Selection</strong> — die besten 10–15 Teams</li>'+
  '<li><strong>Kickoff</strong> — Programmstart</li></ol>'+
  '<h2>Wann sich ein Programm lohnt</h2>'+
  '<ul><li>Du brauchst <strong>Struktur und Deadlines</strong>, um wirklich zu liefern</li>'+
  '<li>Du brauchst <strong>Zugang</strong> — zu Mentor:innen, Investor:innen, ersten Kund:innen</li>'+
  '<li>Du suchst ein <strong>Team</strong></li></ul>'+
  '<div class="hint"><b>Wann nicht:</b> Wenn du schon Traction hast, zahlende Kund:innen und ein Netzwerk, kostet ein Equity-Accelerator mehr, als er bringt. Und ein Programm ersetzt keine Kundengespräche — es beschleunigt nur, was ohnehin läuft.</div>' });
